r:#066a93;font-size:clamp(31px,3.5vw,57px);line-height:1.14;letter-spacing:-.035em}p{margin:0}.body{font-size:clamp(23px,2.35vw,39px);line-height:1.42;white-space:pre-line}.lead{font-size:clamp(23px,2.3vw,37px);line-height:1.36}.question{border-left:10px solid #ffb72e;background:#fff9eb;padding:18px 24px;border-radius:18px;font-size:clamp(23px,2.4vw,38px);line-height:1.35}.split{display:grid;grid-template-columns:1fr minmax(280px,44%);gap:clamp(20px,3vw,45px);align-items:center;flex:1;min-height:0}.split .textside{display:flex;flex-direction:column;gap:clamp(15px,2vh,26px);justify-content:center}.bookimg{display:block;width:100%;max-height:54vh;object-fit:contain;border-radius:26px;border:3px solid #dbedf3;background:#e9f7ff}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.5vw,22px);margin-top:auto;margin-bottom:auto}.choice{min-height:clamp(100px,14vh,155px);background:#f1f9fd;border:3px solid #cae5f2;border-radius:21px;padding:19px 24px;text-align:left;font-size:clamp(22px,2.15vw,34px);line-height:1.29;display:flex;gap:17px;align-items:center;transition:.1s}.choice:hover{background:#e0f5ff}.choice .letter{background:#ffe3a1;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;flex-shrink:0;color:#78520a}.choice.selected{border-color:#197ab0;background:#d9f2ff}.choice.good{border-color:#289d64;background:#e0f8e9}.choice.bad{border-color:#d45761;background:#ffebef}.choice:disabled{cursor:default}.note{font-size:clamp(20px,1.8vw,29px);line-height:1.3;padding:15px 22px;border-radius:16px;background:#e8f8ee;border:2px solid #b6dfc6}.note.wrong{background:#fff2e6;border-color:#ffd19d}.bulletbox{display:grid;gap:18px;margin:auto 0}.bullet{background:#ebf7ff;padding:17px 23px;border-radius:20px;font-size:clamp(24px,2.35vw,37px);line-height:1.28}.bullet:before{content:'✓ ';color:#168956}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:auto}.btn{border:0;border-radius:17px;padding:15px 25px;background:#087cad;color:#fff;font-size:clamp(19px,1.7vw,27px);box-shadow:0 5px 0 #086188}.btn.alt{background:#fff;border:3px solid #b3d9eb;color:#206587;box-shadow:none}.btn.gold{background:#f5a91d;color:#4d370a;box-shadow:0 5px 0 #d18e0c}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.footer{height:77px;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 28px;gap:12px;border-top:2px solid #d8edf6}.footer .btn{padding:12px 25px}.count{font-size:clamp(16px,1.4vw,22px);color:#557285}.focus{background:linear-gradient(135deg,#dff9fc,#fff4df);border-radius:23px;padding:22px;font-size:clamp(25px,2.5vw,42px)}.opening{background:radial-gradient(circle at 30% 25%,#e2f9fa,transparent 50%),#fff}.opening .panel{justify-content:center;align-items:center;text-align:center;gap:25px}.opening h1{font-size:clamp(43px,5.2vw,85px);max-width:1100px}.opening p{font-size:clamp(24px,2.4vw,38px)}.startbtn{padding:22px 50px!important;font-size:clamp(23px,2.4vw,39px)!important}.star{font-size:65px}.reflection{display:grid;grid-template-columns:1fr 1fr;gap:14px}.reflection .choice{min-height:105px}.confetti{font-size:clamp(50px,7vw,110px);text-align:center}@media(max-width:800px){.top{height:65px;padding:7px 12px}.meta{display:none}.iconbtn{padding:9px}.page{padding:9px}.panel{border-radius:20px;padding:17px}.split{grid-template-columns:1fr 42%}.choice{padding:12px;min-height:85px}.choice .letter{width:36px;height:36px}.footer{height:66px;padding:8px}.footer .btn{padding:10px 14px}.bookimg{max-height:47vh}}@media(max-height:700px){.top{height:60px}.footer{height:65px}.page{padding:8px 2vw}.panel{padding:17px 25px;gap:7px}.choice{min-height:82px}.bookimg{max-height:43vh}.question{padding:10px 18px}.actions .btn{padding:8px 15px}}</style></head><body><div id="app"></div><script>
const DATA=[{"stage": 0, "type": "intro", "title": "Trò chơi: Bạn ấy là ai?", "body": "Mỗi bạn có những nét riêng đáng quý. Hãy nghĩ về một bạn trong lớp và mô tả để cả lớp đoán!", "prompt": "Gợi ý: Ngoại hình • Tính cách • Sở thích • Điều bạn ấy làm tốt", "accent": "Không dùng lời chê bai về đặc điểm của bạn."}, {"stage": 0, "type": "talk", "title": "Cùng chia sẻ", "body": "Em có điểm gì khác với các bạn? Điều đó có làm em trở nên kém giá trị hơn không?", "answer": "Mỗi người đều có nét riêng. Khác biệt không làm ai kém giá trị; mọi người đều xứng đáng được tôn trọng."}, {"stage": 0, "type": "mcq", "title": "Khởi động tư duy", "body": "Trong lớp có bạn nói giọng địa phương khác em. Cách ứng xử nào thể hiện sự tôn trọng?", "options": ["Lắng nghe và trò chuyện bình thường với bạn.", "Khuyên bạn hạn chế nói chuyện trước lớp.", "Chỉ nói chuyện với bạn khi không còn ai khác.", "Đề nghị bạn nói giống mọi người trước khi tham gia."], "correct": 0, "why": "Tôn trọng không có nghĩa là bắt người khác thay đổi để giống số đông."}, {"stage": 0, "type": "teach", "title": "Điều em sẽ học", "body": "Tôn trọng sự khác biệt về đặc điểm cá nhân, giới tính, hoàn cảnh và dân tộc; biết thể hiện bằng lời nói, hành động và thái độ.", "bullets": ["Nhận ra những nét khác nhau của mỗi người.", "Giải thích vì sao cần tôn trọng sự khác biệt.", "Ứng xử lịch sự, không phân biệt đối xử."]}, {"stage": 1, "type": "scene", "title": "Tình huống A: Bạn Thái", "body": "Thái hơi mập, chạy không nhanh. Khi chọn bạn vào đội bóng, một số bạn lo Thái sẽ khiến đội thua.", "image": "football", "prompt": "Nếu là Minh, em sẽ nói gì để các bạn không đánh giá Thái chỉ vì ngoại hình?", "answer": "“Đừng lo! Bạn có thể không chạy nhanh, nhưng bạn ấy có thể tranh chấp bóng rất tốt!”"}, {"stage": 1, "type": "mcq", "title": "Hiểu tình huống A", "body": "Vì sao lời nói của Minh là phù hợp?", "options": ["Vì Minh muốn Thái được chọn dù có chơi tốt hay không.", "Vì Minh nhìn nhận năng lực của Thái, không chỉ dựa vào vóc dáng.", "Vì Minh cho rằng vóc dáng chẳng bao giờ ảnh hưởng đến thể thao.", "Vì Minh muốn cả đội ngừng quan tâm đến việc thi đấu."], "correct": 1, "why": "Ta nên đánh giá công bằng dựa trên khả năng, không vội kết luận từ vẻ ngoài."}, {"stage": 1, "type": "scene", "title": "Tình huống B: Bạn Nga", "body": "Nga bị khuyết tật ở chân và phải dùng xe lăn. Các bạn trong lớp thường xuyên vui chơi cùng Nga.", "image": "wheelchair", "prompt": "Các bạn đã thể hiện điều gì? Em có thể làm gì để Nga cùng tham gia?", "answer": "Các bạn hòa đồng, không phân biệt đối xử; hỏi Nga muốn tham gia hoạt động nào và hỗ trợ khi bạn đồng ý."}, {"stage": 1, "type": "mcq", "title": "Hiểu tình huống B", "body": "Trong giờ chơi bóng, việc nào phù hợp nhất khi có bạn dùng xe lăn?", "options": ["Chủ động quyết định bạn sẽ làm trọng tài để an toàn.", "Không mời bạn vì sợ làm bạn ngại.", "Hỏi ý kiến bạn và cùng điều chỉnh cách chơi để ai cũng tham gia.", "Yêu cầu mọi người chuyển sang chơi trò khác mà không hỏi ai."], "correct": 2, "why": "Tôn trọng là lắng nghe mong muốn và tạo cơ hội tham gia, thay vì tự quyết định thay bạn."}, {"stage": 1, "type": "scene", "title": "Tình huống C: Trang phục dân tộc", "body": "Trong chuyến du lịch vùng cao, Hoa thấy bạn nhỏ mặc trang phục truyền thống khác với trang phục của mình.", "image": "ethnic", "prompt": "Em nhận xét thế nào về thái độ của Hoa và lời khuyên của mẹ?", "answer": "Hoa tò mò vì thấy khác lạ; mẹ nhắc Hoa trân trọng bản sắc, làm quen và hỏi thêm một cách lịch sự."}, {"stage": 1, "type": "mcq", "title": "Hiểu tình huống C", "body": "Khi muốn biết về trang phục truyền thống của một người bạn, em nên làm gì?", "options": ["Tự ý chạm vào trang phục để xem chất liệu.", "Nhận xét trang phục của mình đẹp hơn.", "Tránh hỏi vì mọi khác biệt đều khó nói.", "Hỏi lịch sự và lắng nghe bạn giới thiệu."], "correct": 3, "why": "Tìm hiểu với thái độ lịch sự thể hiện sự tôn trọng văn hóa của người khác."}, {"stage": 1, "type": "scene", "title": "Tình huống D: Bầu Chi đội trưởng", "body": "Lớp 5A bầu Chi đội trưởng. Huy phân vân nên chọn bạn nam hay bạn nữ. Luân khuyên chọn người gương mẫu, tích cực.", "image": "council", "prompt": "Em đồng tình với lời khuyên của Luân không? Vì sao?", "answer": "Đồng tình. Nam hay nữ đều có thể làm Chi đội trưởng; nên chọn theo phẩm chất và năng lực."}, {"stage": 1, "type": "mcq", "title": "Hiểu tình huống D", "body": "Tiêu chí nào công bằng nhất khi chọn Chi đội trưởng?", "options": ["Bạn có năng lực tổ chức, trách nhiệm và được lớp tin tưởng.", "Bạn có giọng nói to và chiều cao nổi bật nhất.", "Bạn thuộc nhóm có nhiều bạn thân nhất trong lớp.", "Bạn là nam vì thường dễ quản lí lớp hơn."], "correct": 0, "why": "Giới tính và ngoại hình không quyết định khả năng đảm nhiệm vai trò lãnh đạo."}, {"stage": 1, "type": "story", "title": "Câu chuyện: Cây cọ nhí", "body": "Mỗi dịp Tết, các cây cọ luyện vẽ tranh hoa đào. Một cây cọ nhỏ có ít lông, thân mảnh, bị những cây cọ khác chê bai.", "image": "brushes", "prompt": "Theo em, những cây cọ khác đã có thái độ như thế nào?", "answer": "Các cây cọ lớn đã coi thường, chế giễu cây cọ nhỏ vì vẻ ngoài khác biệt."}, {"stage": 1, "type": "story", "title": "Cây cọ nhí: Bất ngờ", "body": "Ông đồ dùng cây cọ nhỏ để điểm thêm nhụy hoa và những nét vân trên thân đào, khiến bức tranh sinh động hơn.", "image": "brushes", "prompt": "Điểm mạnh riêng của cây cọ nhí là gì?", "answer": "Đầu bút nhỏ tạo được nét tinh tế; mỗi cây cọ đều đóng góp theo cách của mình."}, {"stage": 1, "type": "talk", "title": "Bài học từ câu chuyện", "body": "Nếu các cây cọ đều giống hệt nhau, bức tranh có thể thiếu điều gì?", "answer": "Bức tranh có thể thiếu những nét tinh xảo. Sự khác biệt giúp mỗi người phát huy điểm mạnh, bổ sung cho nhau."}, {"stage": 1, "type": "teach", "title": "Ghi nhớ: Tôn trọng sự khác biệt", "body": "Mỗi người có đặc điểm riêng về ngoại hình, khả năng, sở thích, hoàn cảnh, giới tính và bản sắc văn hóa.", "bullets": ["Không trêu chọc, miệt thị, kì thị hay loại trừ.", "Lắng nghe, đối xử công bằng và giúp đỡ đúng cách.", "Trân trọng những đóng góp riêng của mỗi người."]}, {"stage": 2, "type": "mcq", "title": "Em tán thành hay không? – A", "body": "“Sự khác biệt của mỗi người tạo nên sắc màu đa dạng cho cuộc sống.”", "options": ["Tán thành", "Không tán thành"], "correct": 0, "why": "Sự đa dạng tạo thêm góc nhìn, khả năng và nét đẹp trong tập thể."}, {"stage": 2, "type": "mcq", "title": "Em tán thành hay không? – B", "body": "“Các bạn nữ không nên chơi cùng các bạn nam.”", "options": ["Tán thành", "Không tán thành"], "correct": 1, "why": "Tình bạn không bị giới hạn bởi giới tính; quan trọng là tôn trọng nhau."}, {"stage": 2, "type": "mcq", "title": "Em tán thành hay không? – C", "body": "“Chỉ nên chơi với những bạn có cùng hoàn cảnh với mình.”", "options": ["Tán thành", "Không tán thành"], "correct": 1, "why": "Hoàn cảnh gia đình khác nhau không phải là lí do để phân biệt đối xử."}, {"stage": 2, "type": "mcq", "title": "Em tán thành hay không? – D", "body": "“Mỗi dân tộc có giá trị văn hóa đặc trưng cần được trân trọng và gìn giữ.”", "options": ["Tán thành", "Không tán thành"], "correct": 0, "why": "Mỗi dân tộc đóng góp những nét văn hóa quý giá."}, {"stage": 2, "type": "case", "title": "Nhận xét việc làm – A", "body": "Mỗi lần bị trêu chọc vì vóc dáng nhỏ bé, Tân được Phong đứng ra bênh vực, bảo vệ.", "prompt": "Phong đã làm đúng ở điểm nào? Em còn có thể làm gì?", "answer": "Phong không thờ ơ trước việc bắt nạt. Có thể động viên Tân, nhắc các bạn dừng trêu chọc và nhờ thầy cô giúp khi cần."}, {"stage": 2, "type": "case", "title": "Nhận xét việc làm – B", "body": "Vì Vân thích chơi đàn pi-a-nô, một bạn không ủng hộ em gái đăng kí học chơi nhạc cụ dân tộc.", "prompt": "Việc làm của bạn ấy đã tôn trọng sở thích của em gái chưa?", "answer": "Chưa. Mỗi người có sở thích riêng. Cần lắng nghe và động viên em gái theo đuổi lựa chọn phù hợp."}, {"stage": 2, "type": "case", "title": "Nhận xét việc làm – C", "body": "Nghỉ hè, Tú được bố mẹ đưa về quê. Thấy các bạn đá bóng trên mặt ruộng, Tú vui vẻ xin tham gia.", "prompt": "Em nhận xét thế nào về hành động của Tú?", "answer": "Tú cởi mở, hòa đồng, không phân biệt bạn bè vì hoàn cảnh hoặc nơi sống."}, {"stage": 2, "type": "case", "title": "Nhận xét việc làm – D", "body": "Linh mới chuyển đến, nói giọng địa phương nên ngại tiếp xúc. Thấy vậy, Nga chủ động bắt chuyện, động viên Linh.", "prompt": "Em đánh giá việc làm của Nga thế nào?", "answer": "Nga thân thiện, tôn trọng sự khác biệt về giọng nói và giúp bạn tự tin hòa nhập."}, {"stage": 2, "type": "scene", "title": "Đưa ra lời khuyên – A", "body": "Mai định rủ Hà chơi cùng thì bạn khác ngăn lại: “Chơi với Hà làm gì! Bạn ấy điệu lắm!”.", "image": "school", "prompt": "Nếu là Mai, em sẽ nói gì với bạn?", "answer": "“Mình muốn tự tìm hiểu và chơi với Hà. Chúng ta không nên chê bai hay đánh giá bạn bằng một lời nhận xét.”"}, {"stage": 2, "type": "scene", "title": "Đưa ra lời khuyên – B", "body": "Lan ước mơ trở thành nghệ nhân quan họ. Hương nói: “Cậu buồn cười thật! Lẽ ra phải mơ thành ca sĩ nổi tiếng chứ!”.", "image": "dance", "prompt": "Em sẽ khuyên Lan và Hương như thế nào?", "answer": "Động viên Lan theo đuổi ước mơ; nhắc Hương tôn trọng sở thích và mục tiêu khác nhau."}, {"stage": 2, "type": "scene", "title": "Đưa ra lời khuyên – C", "body": "Na thích chiếc áo màu hồng. Em gái nói: “Sao em có thể thích cái màu này được nhỉ!”.", "image": "clothes", "prompt": "Em sẽ khuyên Na điều gì?", "answer": "Na có quyền thích màu mình chọn; nên nhẹ nhàng nói rằng sở thích của mỗi người có thể khác nhau."}, {"stage": 3, "type": "case", "title": "Xử lí tình huống – A", "body": "Thái thường chơi cờ vua với Ba. Ba muốn Thái bỏ các buổi đá cầu để chơi cùng mình, rồi giận khi Thái không đồng ý.", "prompt": "Nếu là Thái, em sẽ làm gì?", "answer": "Nói với Ba rằng mình trân trọng tình bạn nhưng cũng có sở thích riêng; đề nghị cùng sắp xếp thời gian hoặc thử hoạt động cả hai thích."}, {"stage": 3, "type": "case", "title": "Xử lí tình huống – B", "body": "Thắng và lớp đi thăm trung tâm nuôi dạy trẻ khuyết tật. Một số bạn tỏ ra e ngại, không thích trò chuyện với các bạn ở đó.", "prompt": "Nếu là Thắng, em sẽ làm gì?", "answer": "Chủ động chào hỏi, trò chuyện tự nhiên và mời các bạn cùng tham gia hoạt động; khuyến khích bạn bè đối xử bình đẳng, lịch sự."}, {"stage": 3, "type": "case", "title": "Xử lí tình huống – C", "body": "Trong chung cư của An có một số bạn người nước ngoài. Anh trai An cho rằng họ khác biệt nên khó hòa hợp.", "prompt": "Nếu là An, em sẽ làm gì?", "answer": "Giải thích rằng khác biệt ngôn ngữ, văn hóa không ngăn cản tình bạn; đề nghị làm quen, giúp nhau giao tiếp và tìm hiểu văn hóa."}, {"stage": 3, "type": "create", "title": "Sản phẩm của em: Tôi khác biệt", "body": "Hãy viết, vẽ hoặc trình bày 3 điều làm nên nét riêng của em và 1 điều em trân trọng ở một người bạn.", "prompt": "Gợi ý: “Em thích…”, “Em có thể…”, “Em muốn học…”, “Em trân trọng bạn…”."}, {"stage": 3, "type": "reflection", "title": "Lời hứa tôn trọng", "body": "Chọn một hành động em sẽ thực hiện ngay từ hôm nay.", "options": ["Em sẽ lắng nghe mà không cắt lời.", "Em sẽ không trêu chọc nét khác biệt.", "Em sẽ chủ động kết bạn và giúp đỡ đúng cách.", "Em sẽ khích lệ sở thích, ước mơ của bạn."]}, {"stage": 3, "type": "end", "title": "Hoàn thành bài học!", "body": "Mỗi người một vẻ khác nhau – Làm nên cuộc sống muôn màu đẹp tươi. Hãy mang lời nói, tiếng cười – Với lòng tôn trọng mọi người nghe em!"}],IMAGES={"football": "data:image/webp;base64,UklGRtovAABXRUJQVlA4IM4vAAAwpQCdASpRAcsAPkUejEQioaETujX4KAREsTd+KVdcu+8g+c/2X+H/cX2mrF/gPxN+XH4Gfnv1E74uy/MN5d/5P+R/Mz5o/6/1Wfq32B/1q/4n9z9cv1feYj9nf+1/u/eD/2/7Oe7P+3/6D9r/gF/rf+d///rr+yV+7vsJ/0D/jf//14P3O+HT+x/9b9wvay/9fZzdJ/1f/wnpG8ZPzH938gfx761/O/2/90PYJyp9iWpr8k+8f7X/Efu77Td8/yj1BfzH+m/6b8yvedfsdXKAvzP+wf77/D+Qf/jekP2M/4/uB/zf+qf7D+7/kH9Ff8XxQfwn+1/Y74Av5r/Y/+L/kvzb+mz+x/+H+t/2Hqq/P/8x/7v9H/pPkN/mf9t/6v+J7WH7cf//3dv2W//Bl2v1vdV5rVlCfS2AoKSgmzWR+HfqFJydvJ01YGE const stageNames=['KHỞI ĐỘNG','KHÁM PHÁ','LUYỆN TẬP','VẬN DỤNG'];
let index=-1,selected=null,revealed=false,muted=false,audioCtx=null,finished=false;
const app=document.getElementById('app');
function sound(kind){if(muted)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;function tone(f,a,d,type='sine'){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,t+a);g.gain.setValueAtTime(.001,t+a);g.gain.exponentialRampToValueAtTime(.13,t+a+.015);g.gain.exponentialRampToValueAtTime(.001,t+a+d);o.connect(g);g.connect(audioCtx.destination);o.start(t+a);o.stop(t+a+d+.01)}if(kind==='right'){tone(523,0,.15);tone(659,.13,.18);tone(784,.27,.23)}else if(kind==='wrong'){tone(330,0,.22,'triangle');tone(255,.21,.27,'triangle')}else if(kind==='click'){tone(440,0,.075)}else{tone(523,0,.13);tone(659,.14,.15);tone(784,.30,.16);tone(1047,.47,.25)}}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function full(){let el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{});else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});}
function jump(n){index=Math.max(-1,Math.min(DATA.length-1,n));selected=null;revealed=false;sound('click');render()}
function stageStart(s){jump(DATA.findIndex(p=>p.stage===s))}
function choose(i){if(revealed)return;selected=i;sound('click');render()}
function verify(){if(selected===null)return;revealed=true;sound(selected===DATA[index].correct?'right':'wrong');render()}
function reveal(){revealed=!revealed;sound('click');render()}
function topbar(){let phase=index<0?0:DATA[index].stage;let dots=DATA.map((p,i)=>'<span class="'+(i<=index?'stage'+p.stage:'')+'" title="'+stageNames[p.stage]+'"></span>').join('');return `<div class="top"><span class="brand">🌟 TÔN TRỌNG SỰ KHÁC BIỆT</span><span class="meta">${index<0?'Bài 2 – Đạo đức lớp 5':stageNames[phase]+' · Hoạt động '+(index+1)+'/'+DATA.length}</span><div class="controls"><button class="iconbtn" onclick="toggleSound()" title="Bật/tắt âm thanh">${muted?'🔇':'🔊'}</button><button class="iconbtn" onclick="full()" title="Toàn màn hình (F)">⛶</button><button class="iconbtn" onclick="if(confirm('Về trang mở đầu và xóa câu trả lời?'))jump(-1)" title="Về đầu">⌂</button></div></div><div class="progress">${dots}</div>`}
function footer(){return `<div class="footer"><button class="btn alt" onclick="jump(${index-1})">← Quay lại</button><span class="count">${index<0?'Sẵn sàng học tập':stageNames[DATA[index].stage]+' • '+(index+1)+' / '+DATA.length}</span><button class="btn" onclick="${index===DATA.length-1?'jump(-1)':'jump('+(index+1)+')'}">${index===DATA.length-1?'Học lại ↻':'Tiếp theo →'}</button></div>`}
function render(){if(index<0){app.innerHTML=topbar()+`<div class="page opening"><div class="panel"><div class="star">🌈✨</div><div class="stagepill">ĐẠO ĐỨC • LỚP 5 • BÀI 2</div><h1>TÔN TRỌNG SỰ KHÁC BIỆT CỦA NGƯỜI KHÁC</h1><p>Mỗi người một vẻ – Cùng nhau tạo nên lớp học đáng yêu!</p><button class="btn gold startbtn" onclick="jump(0)">▶ BẮT ĐẦU BÀI HỌC</button><p style="font-size:20px;color:#5d7d90">4 chặng: Khởi động • Khám phá • Luyện tập • Vận dụng</p></div></div>`+footer();return}
let p=DATA[index],phase=p.stage,head=`<span class="stagepill">${['🌞','🔎','🎯','🚀'][phase]} CHẶNG ${phase+1}: ${stageNames[phase]}</span><h1>${esc(p.title)}</h1>`;
let content='';let body=p.body?`<div class="lead">${esc(p.body)}</div>`:'';
if(p.type==='mcq'){let choices=p.options.map((o,i)=>{let state=selected===i?' selected':'';if(revealed)state+=(i===p.correct?' good':i===selected?' bad':'');return `<button class="choice${state}" onclick="choose(${i})" ${revealed?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`}).join('');content=body+`<div class="choices">${choices}</div>`+(revealed?`<div class="note ${selected===p.correct?'':'wrong'}">${selected===p.correct?'✅ Chính xác!':'💡 Cùng suy nghĩ lại!'} ${esc(p.why)}</div>`:'')+`<div class="actions"><button class="btn gold" onclick="verify()" ${selected===null||revealed?'disabled':''}>Kiểm tra đáp án ✓</button>${revealed?'<button class="btn alt" onclick="selected=null;revealed=false;render()">Làm lại</button>':''}</div>`}
else if(p.type==='scene'||p.type==='story'){content=`<div class="split"><div class="textside">${body}<div class="question">❓ ${esc(p.prompt)}</div>${revealed?`<div class="note">💡 ${esc(p.answer)}</div>`:''}<div class="actions"><button class="btn gold" onclick="reveal()">${revealed?'Ẩn gợi ý':'Hiện gợi ý trả lời 💡'}</button></div></div><img class="bookimg" alt="Tranh minh họa trích từ sách giáo khoa" src="${IMAGES[p.image]}"></div>`}
else if(p.type==='teach'){content=body+`<div class="bulletbox">${p.bullets.map(x=>`<div class="bullet">${esc(x)}</div>`).join('')}</div>`}
else if(p.type==='talk'||p.type==='case'){content=body+`<div class="question">❓ ${esc(p.prompt||p.body)}</div>`+(revealed?`<div class="note">💡 ${esc(p.answer)}</div>`:'')+`<div class="actions"><button class="btn gold" onclick="reveal()">${revealed?'Ẩn gợi ý':'Hiện gợi ý trả lời 💡'}</button></div>`}
else if(p.type==='intro'){content=body+`<div class="focus">🎤 ${esc(p.prompt)}</div><div class="note">💛 ${esc(p.accent)}</div>`}
else if(p.type==='create'){content=body+`<div class="focus">🖍️ ${esc(p.prompt)}</div><div class="note">Sản phẩm có thể là một tờ giấy, bức vẽ, video hoặc bài thuyết trình ngắn.</div>`}
else if(p.type==='reflection'){content=body+`<div class="choices reflection">${p.options.map((o,i)=>`<button class="choice ${selected===i?'good':''}" onclick="choose(${i})"><span class="letter">${selected===i?'✓':'♡'}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="note">${selected!==null?'🌟 Hãy thực hiện điều em đã chọn ngay hôm nay!':'💗 Mọi lựa chọn trên đều là hành động đáng quý.'}</div>`}
else if(p.type==='end'){if(!finished){sound('done');finished=true}content=`<div class="confetti">🎉 🏆 🌈</div><div class="focus" style="white-space:pre-line;text-align:center">${esc(p.body.replace(' – ',' –\n').replace(' – Với',' –\nVới'))}</div><div class="note" style="text-align:center">Em đã hoàn thành cả 4 chặng học tập. Hãy tiếp tục tôn trọng sự khác biệt mỗi ngày!</div><div class="actions"><button class="btn gold" onclick="jump(-1)">🔁 Học lại từ đầu</button></div>`}
app.innerHTML=topbar()+`<main class="page"><section class="panel">${head}${content}</section></main>`+footer();}
function toggleSound(){muted=!muted;if(!muted)sound('click');render()}
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();jump(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();jump(index-1)}if(e.key.toLowerCase()==='f')full();if(e.key==='Enter'&&index>=0&&DATA[index].type==='mcq'&&selected!==null&&!revealed)verify()});render();
</script></body></html>
