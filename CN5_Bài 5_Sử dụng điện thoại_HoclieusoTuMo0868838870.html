<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5: Sử Dụng Điện Thoại - Công Nghệ 5</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Nunito & Quicksand (Chữ không chân, tròn đều, đậm nét, hỗ trợ Tiếng Việt hoàn hảo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,700;0,800;0,900;1,700&family=Quicksand:wght@700&display=swap&subset=vietnamese" rel="stylesheet">
    <style>
        :root {
            --font-primary: 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
            --tv-scale: 1;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            font-family: var(--font-primary);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
            color: #0f172a;
        }
        /* Hệ thống cỡ chữ tối ưu cho trình chiếu Tivi lớp học */
        body.tv-normal {
            --title-size: clamp(1.45rem, 2.2vw, 2.1rem);
            --subtitle-size: clamp(1.05rem, 1.45vw, 1.35rem);
            --card-title: clamp(1.2rem, 1.7vw, 1.6rem);
            --body-size: clamp(1.1rem, 1.5vw, 1.42rem);
            --option-size: clamp(1.12rem, 1.55vw, 1.45rem);
            --badge-size: clamp(0.9rem, 1.15vw, 1.1rem);
        }
        body.tv-large {
            --title-size: clamp(1.65rem, 2.5vw, 2.35rem);
            --subtitle-size: clamp(1.18rem, 1.65vw, 1.5rem);
            --card-title: clamp(1.35rem, 1.95vw, 1.8rem);
            --body-size: clamp(1.22rem, 1.7vw, 1.6rem);
            --option-size: clamp(1.25rem, 1.75vw, 1.62rem);
            --badge-size: clamp(1rem, 1.25vw, 1.2rem);
        }
        body.tv-xlarge {
            --title-size: clamp(1.85rem, 2.8vw, 2.6rem);
            --subtitle-size: clamp(1.3rem, 1.8vw, 1.65rem);
            --card-title: clamp(1.5rem, 2.15vw, 2rem);
            --body-size: clamp(1.35rem, 1.9vw, 1.75rem);
            --option-size: clamp(1.38rem, 1.95vw, 1.8rem);
            --badge-size: clamp(1.08rem, 1.35vw, 1.3rem);
        }
        .tv-title { font-size: var(--title-size); line-height: 1.22; font-weight: 900; }
        .tv-subtitle { font-size: var(--subtitle-size); line-height: 1.35; font-weight: 800; }
        .tv-card-title { font-size: var(--card-title); line-height: 1.28; font-weight: 900; }
        .tv-body { font-size: var(--body-size); line-height: 1.4; font-weight: 800; }
        .tv-option { font-size: var(--option-size); line-height: 1.36; font-weight: 800; }
        .tv-badge { font-size: var(--badge-size); line-height: 1.2; font-weight: 900; }

        .custom-scroll::-webkit-scrollbar {
            width: 10px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(226, 232, 240, 0.6);
            border-radius: 9999px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #64748b;
            border-radius: 9999px;
        }
        .btn-kid {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 0 rgba(15, 23, 42, 0.18);
        }
        .btn-kid:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 rgba(15, 23, 42, 0.22);
        }
        .btn-kid:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(15, 23, 42, 0.18);
        }
        .card-kid {
            box-shadow: 0 14px 32px -6px rgba(15, 23, 42, 0.1), 0 8px 14px -6px rgba(15, 23, 42, 0.06);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.97) translateY(6px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .step-enter {
            animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="tv-large flex flex-col justify-between h-screen w-screen overflow-hidden">

                </svg>

    <!-- THANH CHUYỂN CHẶNG TRÊN MÀN HÌNH NHỎ -->
    <div class="xl:hidden bg-white/90 border-b-2 border-sky-200 px-3 py-1.5 flex items-center justify-center gap-2 shrink-0" id="stage-tabs-mobile">

    <!-- VÙNG NỘI DUNG CHÍNH (MAIN STAGE - RỘNG RÃI, CHỮ TO RÕ CHO TIVI) -->

    <!-- MÃ NGUỒN JAVASCRIPT XỬ LÝ TOÀN BỘ TƯƠNG TÁC BÀI 5 -->
    <script>
        /**************************************************************
         * 1. CHẾ ĐỘ CỠ CHỮ TIVI & HỆ THỐNG ÂM THANH (WEB AUDIO + DTMF)
         **************************************************************/
        const fontModes = [
            { cls: 'tv-normal', label: 'Chuẩn TV' },
            { cls: 'tv-large', label: 'To (TV)' },
            { cls: 'tv-xlarge', label: 'Siêu to' }
        ];
        let currentFontModeIdx = 1; // Mặc định chế độ "To (TV)" cho học sinh bàn cuối

        function cycleFontSize() {
            playSound('click');
            document.body.classList.remove(fontModes[currentFontModeIdx].cls);
            currentFontModeIdx = (currentFontModeIdx + 1) % fontModes.length;
            document.body.classList.add(fontModes[currentFontModeIdx].cls);
            document.getElementById('font-size-label').textContent = fontModes[currentFontModeIdx].label;
        }

        let soundEnabled = true;
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Bảng tần số âm thanh bấm phím điện thoại thực tế (DTMF)
        const DTMF_FREQS = {
            '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
            '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
            '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
            '*': [941, 1209], '0': [941, 1336], '#': [941, 1477]
        };

        function playDTMF(key) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioCtx();
                const now = ctx.currentTime;
                const pair = DTMF_FREQS[key] || [770, 1336];
                pair.forEach(freq => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                });
            } catch (e) {}
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioCtx();
                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(580, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.065);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.07);
                } else if (type === 'pop') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(460, now);
                    osc.frequency.exponentialRampToValueAtTime(940, now + 0.1);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.11);
                } else if (type === 'ring') {
                    // Tiếng chuông điện thoại reo vui nhộn
                    [0, 0.14, 0.28].forEach((offset, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(i % 2 === 0 ? 880 : 1174.66, now + offset);
                        gain.gain.setValueAtTime(0.18, now + offset);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + offset);
                        osc.stop(now + offset + 0.13);
                    });
                } else if (type === 'correct') {
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.075);
                        gain.gain.setValueAtTime(0.24, now + idx * 0.075);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.075 + 0.26);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.075);
                        osc.stop(now + idx * 0.075 + 0.27);
                    });
                } else if (type === 'wrong') {
                    const notes = [300, 235];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.13);
                        gain.gain.setValueAtTime(0.13, now + idx * 0.13);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.13 + 0.2);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.13);
                        osc.stop(now + idx * 0.13 + 0.21);
                    });
                } else if (type === 'fanfare') {
                    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
                    const times = [0, 0.11, 0.22, 0.33, 0.47, 0.62];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + times[idx]);
                        gain.gain.setValueAtTime(0.25, now + times[idx]);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + times[idx] + 0.32);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + times[idx]);
                        osc.stop(now + times[idx] + 0.33);
                    });
                }
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
            if (soundEnabled) playSound('pop');
        }

        function toggleFullScreen() {
            playSound('click');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'vi-VN';
            utter.rate = 0.95;
            utter.pitch = 1.04;
            const ttsBtn = document.getElementById('tts-label');
            utter.onstart = () => { if (ttsBtn) ttsBtn.textContent = 'Đang đọc...'; };
            utter.onend = () => { if (ttsBtn) ttsBtn.textContent = 'Đọc bài'; };
            utter.onerror = () => { if (ttsBtn) ttsBtn.textContent = 'Đọc bài'; };
            window.speechSynthesis.speak(utter);
        }

        function speakCurrentStep() {
            playSound('pop');
            const currentStepObj = STAGES[state.stageIdx].steps[state.stepIdx];
            if (currentStepObj && currentStepObj.voiceText) {
                speakText(currentStepObj.voiceText);
            }
        }

        /**************************************************************
         * 2. HIỆU ỨNG PHÁO HOA CHÚC MỪNG (CONFETTI)
         **************************************************************/
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#eab308'];
            for (let i = 0; i < 100; i++) {
                pieces.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 300,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: -Math.random() * 16 - 5,
                    size: Math.random() * 11 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vrot: (Math.random() - 0.5) * 12
                });
            }

            let frame = 0;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.42;
                    p.rot += p.vrot;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                    ctx.restore();
                });
                frame++;
                if (frame < 95) {
                    requestAnimationFrame(render);
                } else {

                const badge = document.getElementById('star-badge');
                if (el) el.textContent = state.stars;
                if (badge) {
                    badge.classList.add('scale-110');
                    setTimeout(() => badge.classList.remove('scale-110'), 280);
                }
            }
        }

                                💡 <b>Hướng dẫn:</b> Bước 1: Bấm các chữ số trên bàn phím bên phải ➔ Bước 2: Nhấn nút <b>Gọi (📞 màu xanh)</b>.
                            </div>
                        </div>
                    </div>

                    <!-- Cột phải: Bàn phím điện thoại thông minh chữ cực to -->
                    <div class="lg:col-span-6 bg-slate-900 border-4 border-slate-700 rounded-3xl p-4 sm:p-5 max-w-md mx-auto w-full flex flex-col gap-3 shadow-xl">
                        <!-- Màn hình hiển thị số đang bấm -->
                        <div class="bg-slate-800 border-2 border-slate-600 rounded-2xl px-4 py-3 flex items-center justify-between">
                            <span class="text-3xl sm:text-4xl font-black text-emerald-400 tracking-widest min-h-[42px]">
                                ${state.dialInput || 'Nhập số...'}
                            </span>
                            <button onclick="backspaceDial()" title="Xóa 1 số"
                                class="btn-kid bg-slate-700 hover:bg-slate-600 text-white px-3.5 py-1.5 rounded-xl font-black text-lg">
                                ⌫ Xóa
                            </button>
                        </div>

                        <!-- Lưới phím số 0 - 9, *, # -->
                        <div class="grid grid-cols-3 gap-2.5">
                            ${['1', '2', '3', '4', '5', '6', '7', '8', '9', '*', '0', '#'].map(k => `
                                <button onclick="pressPhoneKey('${k}')"
                                    class="btn-kid bg-slate-800 hover:bg-slate-700 active:bg-sky-600 text-white border-2 border-slate-600 rounded-2xl py-2.5 text-2xl sm:text-3xl font-black">
                                    ${k}
                                </button>
                            `).join('')}
                        </div>

                        <!-- Nút Gọi xanh & Nút Kết thúc đỏ -->
                        <div class="grid grid-cols-2 gap-3 mt-1">
                            <button onclick="submitPhoneCall()"
                                class="btn-kid bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3 rounded-2xl text-xl flex items-center justify-center gap-2">
                                <span>📞</span> <span>GỌI NGAY</span>
                            </button>
                            <button onclick="clearDialInput()"
                                class="btn-kid bg-rose-500 hover:bg-rose-600 text-white font-black py-3 rounded-2xl text-xl flex items-center justify-center gap-2">
                                <span>📴</span> <span>KẾT THÚC</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            if (allSolved) {
                showFeedback(true, 'Tuyệt vời! Em đã thực hành thành thạo thao tác bấm số và gọi điện trên bàn phím!');
            }
        }

        function switchDialTask(idx) {
            playSound('click');
            state.dialTaskIdx = idx;
            state.dialInput = '';
            hideFeedback();
            renderApp();
        }

        function pressPhoneKey(key) {
            if (state.dialInput.length < 10) {
                state.dialInput += key;
                playDTMF(key);
                renderApp();
            }
        }

        function backspaceDial() {
            playSound('click');
            state.dialInput = state.dialInput.slice(0, -1);
            renderApp();
        }

        function clearDialInput() {
            playSound('click');
            state.dialInput = '';
            hideFeedback();
            renderApp();
        }

        function submitPhoneCall() {
            const task = DIAL_TASKS[state.dialTaskIdx];
            if (state.dialInput === task.targetNumber) {
                state.dialTasksSolved[state.dialTaskIdx] = true;
                playSound('ring');
                rewardStar('dial_task_' + state.dialTaskIdx, 1);
                showFeedback(true, task.successMsg);
                setTimeout(() => {
                    if (state.dialTaskIdx < DIAL_TASKS.length - 1 && !state.dialTasksSolved[state.dialTaskIdx + 1]) {
                        state.dialTaskIdx++;
                        state.dialInput = '';
                    }
                    renderApp();
                }, 1100);
            } else {
                playSound('wrong');
                showFeedback(false, `Số "${state.dialInput || '...'}" chưa đúng với tình huống này! Em hãy kiểm tra lại nhé.`);
            }
        }

        // Bước 2/4: Đóng vai xử lí Tình huống 1 (Trang 25)
        function renderStep4_2(container) {
            renderPracticeMCQ5(
                container,
                'roleplay1Done',
                'Đóng vai xử lí Tình huống 1 (SGK Trang 25)',
                'Tình huống 1: Khi em ở nhà một mình và có cuộc gọi đến điện thoại cố định từ một người lạ hỏi: "Bố mẹ cháu có ở nhà không? Đọc cho cô/chú địa chỉ nhà cháu nhé!". Em nên xử lí như thế nào?',
                [
                    {
                        text: 'A. Thật thà trả lời: "Cháu đang ở nhà một mình, bố mẹ cháu đi làm tối mới về ạ" rồi đọc rõ địa chỉ nhà cho người lạ.',
                        correct: false,
                        explain: 'Rất mất an toàn! Tuyệt đối không tiết lộ việc em đang ở nhà một mình và không đọc địa chỉ nhà cho người lạ.'
                    },
                    {
                        text: 'B. Trả lời lịch sự: "Dạ hiện tại bố mẹ cháu đang bận không nghe máy được ạ. Cô/chú tên là gì và có việc gì để cháu nhắn lại ạ?", tuyệt đối không nói mình ở nhà một mình và báo ngay cho bố mẹ.',
                        correct: true,
                        explain: 'Hoàn toàn chính xác! Cách ứng xử này vừa lịch sự, lễ phép vừa đảm bảo an toàn và bảo mật thông tin gia đình.'
                    },
                    {
                        text: 'C. Hét to vào ống nghe rồi đập mạnh ống nghe xuống bàn phím để người lạ không dám gọi lại nữa.',
                        correct: false,
                        explain: 'Chưa phù hợp! Chúng ta cần giữ thái độ bình tĩnh, lịch sự nhưng kiên quyết bảo mật thông tin.'
                    },
                    {
                        text: 'D. Mời người lạ đến thẳng nhà mình ngay bây giờ để tự nói chuyện vì mình không biết nội dung công việc.',
                        correct: false,
                        explain: 'Nguy hiểm! Khi ở nhà một mình tuyệt đối không hẹn hoặc mở cửa cho người lạ vào nhà.'
                    }
                ]
            );
        }

        // Bước 3/4: Đóng vai xử lí Tình huống 2 (Trang 25)
        function renderStep4_3(container) {
            renderPracticeMCQ5(
                container,
                'roleplay2Done',
                'Đóng vai xử lí Tình huống 2 (SGK Trang 25)',
                'Tình huống 2: Khi em gọi điện thoại cho bạn Minh để hỏi bài nhưng bố của bạn Minh lại là người nhấc máy trả lời. Em nên nói như thế nào?',
                [
                    {
                        text: 'A. Im lặng rồi bấm nút Kết thúc cuộc gọi màu đỏ ngay lập tức vì không phải bạn Minh nghe máy.',
                        correct: false,
                        explain: 'Chưa đúng quy tắc giao tiếp! Tự ý ngắt cuộc gọi đột ngột (bất ngờ kết thúc cuộc gọi) là thiếu lịch sự.'
                    },
                    {
                        text: 'B. Nói ngắn gọn: "A lô! Cho gặp Minh ngay bây giờ đi ạ!" để tiết kiệm thời gian cuộc gọi.',
                        correct: false,
                        explain: 'Chưa lễ phép! Em cần chào hỏi người lớn, tự giới thiệu tên mình trước khi xin phép gặp bạn.'
                    },
                    {
                        text: 'C. Lễ phép nói: "Cháu chào bác ạ! Cháu là An, bạn cùng lớp với Minh ạ. Bác cho cháu xin phép nói chuyện với bạn Minh một chút về bài học được không ạ?".',
                        correct: true,
                        explain: 'Xuất sắc! Lời thoại đầy đủ: Chào hỏi lễ phép ➔ Xưng danh ➔ Nêu rõ mục đích cuộc gọi với thái độ tôn trọng.'
                    },
                    {
                        text: 'D. Hỏi ngược lại: "Ai đang cầm máy của Minh đấy? Sao Minh không tự nghe điện thoại?".',
                        correct: false,
                        explain: 'Chưa lịch sự! Khi gọi điện, người gọi phải chủ động chào hỏi và xưng danh trước.'
                    }
                ]
            );
        }

        // Bước 4/4: Đóng vai xử lí Tình huống 3 & Tổng kết trao Huy hiệu (Trang 25)
        function renderStep4_4(container) {
            if (!state.roleplay3Done) {
                renderPracticeMCQ5(
                    container,
                    'roleplay3Done',
                    'Đóng vai xử lí Tình huống 3 (SGK Trang 25)',
                    'Tình huống 3: Em gọi điện thoại cho bạn cùng lớp để trao đổi về nội dung bài học. Cách thực hiện nào dưới đây vừa hiệu quả vừa đúng quy tắc giao tiếp?',
                    [
                        {
                            text: 'A. Chào bạn, nêu rõ câu hỏi bài tập cần trao đổi với giọng nói từ tốn; khi trao đổi xong thì cảm ơn và chào tạm biệt bạn rồi mới nhấn nút kết thúc cuộc gọi.',
                            correct: true,
                            explain: 'Hoàn toàn chính xác! Em đã hoàn thành xuất sắc cả 3 tình huống đóng vai của Bài 5!'
                        },
                        {
                            text: 'B. Vừa cắm dây sạc điện thoại vừa nằm nói chuyện lan man suốt 2 tiếng đồng hồ về các trò chơi điện tử.',
                            correct: false,
                            explain: 'Chưa đúng! Vừa sạc vừa dùng gây mất an toàn, và nói chuyện quá lâu không đúng mục đích học tập là không tiết kiệm.'
                        },
                        {
                            text: 'C. Hỏi xong bài tập là bấm tắt máy ngay lập tức mà không cần cảm ơn hay chào tạm biệt bạn.',
                            correct: false,
                            explain: 'Chưa đúng quy tắc! Không được bất ngờ kết thúc cuộc gọi mà cần chào tạm biệt lịch sự.'
                        }
                    ]
                );
                return;
            }

            container.innerHTML = `
                <div class="step-enter max-w-[1460px] mx-auto w-full flex flex-col gap-4">
                    <div class="bg-gradient-to-r from-amber-100 via-yellow-50 to-emerald-100 border-4 border-amber-400 rounded-3xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <div class="text-5xl sm:text-6xl">🏆📱</div>
                            <div>
                                <div class="tv-badge uppercase text-amber-800">Hoàn thành xuất sắc Bài 5: Sử dụng điện thoại</div>
                                <h2 class="tv-title text-slate-900">
                                    Huy Hiệu: Đại Sứ Văn Minh Điện Thoại!
                                </h2>
                                <p class="tv-body text-slate-800 mt-1">
                                    Tổng số Sao lớp mình đạt được: <span class="text-amber-600 font-black text-3xl">${state.stars} ⭐</span>
                                </p>
                            </div>
                        </div>
                        <div class="flex gap-3 shrink-0">
                            <button onclick="celebrateFinishLesson5()"
                                class="btn-kid bg-gradient-to-r from-amber-500 to-orange-600 text-white font-black px-5 py-3 rounded-2xl text-lg">
                                🎉 Bắn pháo hoa
                            </button>
                            <button onclick="goToStage(0, 0)"
                                class="btn-kid bg-white hover:bg-sky-50 text-sky-950 border-3 border-sky-400 font-black px-5 py-3 rounded-2xl text-lg">
                                🔄 Học lại từ đầu
                            </button>
                        </div>
                    </div>

                    <!-- Bảng tổng kết ghi nhớ cốt lõi Trang 25 SGK -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-sky-50 border-4 border-sky-300 rounded-3xl p-5">
                            <div class="tv-card-title text-sky-900 mb-2">🛡️ 1. Lưu ý khi sử dụng điện thoại:</div>
                            <ul class="tv-body text-slate-800 space-y-1.5 list-disc list-inside">
                                <li>Không sử dụng khi đang sạc pin và khi pin yếu.</li>
                                <li>Chỉ sử dụng khi cần thiết; thời gian vừa phải.</li>
                                <li>Đảm bảo an toàn, bảo mật thông tin cá nhân.</li>
                                <li>Nhớ số người thân và 5 số khẩn cấp: <b>111, 112, 113, 114, 115</b>.</li>
                            </ul>
                        </div>

                        <div class="bg-emerald-50 border-4 border-emerald-300 rounded-3xl p-5">
                            <div class="tv-card-title text-emerald-900 mb-2">🤝 2. Quy tắc giao tiếp qua điện thoại:</div>
                            <ul class="tv-body text-slate-800 space-y-1.5 list-disc list-inside">
                                <li>Chào hỏi, xưng danh và nêu mục đích của cuộc gọi.</li>
                                <li>Thể hiện thái độ thân thiện và lịch sự.</li>
                                <li>Giọng nói từ tốn, vừa phải.</li>
                                <li>Không bất ngờ kết thúc cuộc gọi.</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;

            showFeedback(true, 'Em hãy chia sẻ với người thân trong gia đình về cách sử dụng điện thoại an toàn, tiết kiệm, hiệu quả nhé!');
        }

        function celebrateFinishLesson5() {
            playSound('fanfare');
            launchConfetti();
            showFeedback(true, 'Chúc mừng các em đã nắm vững toàn bộ kiến thức Bài 5: Sử dụng điện thoại!');
        }

        /**************************************************************
         * 10. ĐIỀU HƯỚNG CHẶNG & BƯỚC (STAGE & STEP NAVIGATION)
         **************************************************************/
        function goToStage(sIdx, stIdx = 0) {
            playSound('click');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            state.stageIdx = sIdx;
            state.stepIdx = stIdx;
            hideFeedback();
            renderApp();
        }

        function prevStep() {
            playSound('click');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            hideFeedback();
            if (state.stepIdx > 0) {
                state.stepIdx--;
            } else if (state.stageIdx > 0) {
                state.stageIdx--;
                state.stepIdx = STAGES[state.stageIdx].steps.length - 1;
            }
            renderApp();
        }

        function nextStep() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            hideFeedback();
            const currentStage = STAGES[state.stageIdx];
            if (state.stepIdx < currentStage.steps.length - 1) {
                playSound('click');
                state.stepIdx++;
                renderApp();
            } else if (state.stageIdx < STAGES.length - 1) {
                playSound('fanfare');
                launchConfetti();
                state.stageIdx++;
                state.stepIdx = 0;
                renderApp();
            } else {
                celebrateFinishLesson5();
            }
        }

        function renderApp() {
            const currentStage = STAGES[state.stageIdx];
            const currentStep = currentStage.steps[state.stepIdx];

            // 1. Render 4 nút chuyển chặng trên Header & Mobile
            const tabsHtml = STAGES.map((st, idx) => {
                const isActive = idx === state.stageIdx;
                return `
                    <button onclick="goToStage(${idx}, 0)"
                        class="px-4 py-1.5 rounded-xl font-black text-base sm:text-lg transition-all flex items-center gap-1.5 ${
                            isActive
                                ? `bg-gradient-to-r ${st.color} text-white shadow`
                                : 'text-slate-700 hover:bg-white'
                        }">
                        <span>${st.title}</span>
                    </button>
                `;
            }).join('');
            document.getElementById('stage-tabs').innerHTML = tabsHtml;
            document.getElementById('stage-tabs-mobile').innerHTML = tabsHtml;

            // 2. Render Tiêu đề bước hiện tại (Chữ cực to rõ cho Tivi)
            document.getElementById('step-header').innerHTML = `
                <div class="flex flex-col">
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-0.5 rounded-xl tv-badge uppercase border-2 ${currentStage.badgeBg}">
                            ${currentStage.title} • Bước ${state.stepIdx + 1}/${currentStage.steps.length}
                        </span>
                    </div>
                    <h2 class="tv-title text-slate-900 mt-1">
                        ${currentStep.title}
                    </h2>
                    <p class="tv-subtitle text-slate-700 mt-0.5">
                        ${currentStep.subtitle}
                    </p>
                </div>
            `;

            // 3. Render Nội dung bước hiện tại
            const bodyEl = document.getElementById('step-body');
            currentStep.render(bodyEl);

            // 4. Render Thanh chấm tiến trình dưới cùng
            const dotsHtml = currentStage.steps.map((_, idx) => {
                const active = idx === state.stepIdx;
                return `
                    <button onclick="goToStage(${state.stageIdx}, ${idx})"
                        title="Bước ${idx + 1}"
                        class="h-4 rounded-full transition-all ${
                            active ? 'w-10 bg-sky-600' : 'w-4 bg-slate-300 hover:bg-slate-400'
                        }"></button>
                `;
            }).join('');
            document.getElementById('step-dots').innerHTML = dotsHtml;
            document.getElementById('step-counter-text').textContent =
                `${currentStage.title} — Bước ${state.stepIdx + 1} / ${currentStage.steps.length}`;

            // 5. Cập nhật trạng thái nút Quay lại & Tiếp theo
            const btnPrev = document.getElementById('btn-prev');
            btnPrev.disabled = (state.stageIdx === 0 && state.stepIdx === 0);

            const btnNextText = document.getElementById('btn-next-text');
            const isLastStepOfStage = state.stepIdx === currentStage.steps.length - 1;
            const isLastStage = state.stageIdx === STAGES.length - 1;

            if (isLastStepOfStage && !isLastStage) {
                btnNextText.textContent = `Sang ${STAGES[state.stageIdx + 1].title} 🎉`;
            } else if (isLastStepOfStage && isLastStage) {
                btnNextText.textContent = 'Hoàn thành bài học 🏆';
            } else {
                btnNextText.textContent = 'Tiếp theo';
            }
        }

        window.onload = function () {
            renderApp();
        };
    </script>
</body>
</html>
