<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2: Nhà Sáng Chế - Công Nghệ Tiểu Học</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Nunito & Quicksand (Không chân, tròn đều, đậm nét, hỗ trợ 100% tiếng Việt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Quicksand:wght@600;700&display=swap&subset=vietnamese" rel="stylesheet">
    <style>
        :root {
            --font-primary: 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: var(--font-primary);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef9c3 100%);
            color: #1e293b;
        }
        /* Thanh cuộn mượt mà trong khung nội dung nếu màn hình nhỏ */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(226, 232, 240, 0.5);
            border-radius: 9999px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 9999px;
        }
        /* Hiệu ứng nút bấm 3D thân thiện với học sinh tiểu học */
        .btn-kid {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
        }
        .btn-kid:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 rgba(0, 0, 0, 0.2);
        }
        .btn-kid:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
        }
        .card-kid {
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.94) translateY(8px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .step-enter {
            animation: popIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.6); }
            50% { box-shadow: 0 0 0 10px rgba(250, 204, 21, 0); }
        }
        .glow-yellow {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>
<body class="flex flex-col justify-between h-screen w-screen overflow-hidden">

    <!-- JAVASCRIPT XỬ LÝ ÂM THANH, NỘI DUNG & TƯƠNG TÁC -->
    <script>
        /**************************************************************
         * 1. HỆ THỐNG ÂM THANH SINH ĐỘNG (WEB AUDIO API + SPEECH)
         **************************************************************/
        let soundEnabled = true;
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioCtx();
                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.09);
                } else if (type === 'pop') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.13);
                } else if (type === 'correct') {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.22, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.28);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.3);
                    });
                } else if (type === 'wrong') {
                    const notes = [300, 240];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.14);
                        gain.gain.setValueAtTime(0.14, now + idx * 0.14);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.22);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.14);
                        osc.stop(now + idx * 0.14 + 0.24);
                    });
                } else if (type === 'fanfare') {
                    const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
                    const times = [0, 0.12, 0.24, 0.36, 0.52, 0.68];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + times[idx]);
                        gain.gain.setValueAtTime(0.25, now + times[idx]);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + times[idx] + 0.35);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + times[idx]);
                        osc.stop(now + times[idx] + 0.36);
                    });
                }
            } catch (e) {
                // Bỏ qua nếu trình duyệt chặn tự động phát
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
            if (soundEnabled) playSound('pop');
        }

        function toggleFullScreen() {
            playSound('click');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        // Đọc giọng nói Tiếng Việt (Web Speech API)
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'vi-VN';
            utter.rate = 0.95;
            utter.pitch = 1.05;
            const ttsBtn = document.getElementById('tts-label');
            utter.onstart = () => { if (ttsBtn) ttsBtn.textContent = 'Đang đọc...'; };
            utter.onend = () => { if (ttsBtn) ttsBtn.textContent = 'Đọc bài'; };
            utter.onerror = () => { if (ttsBtn) ttsBtn.textContent = 'Đọc bài'; };
            window.speechSynthesis.speak(utter);
        }

        function speakCurrentStep() {
            playSound('pop');
            const currentStepObj = STAGES[state.stageIdx].steps[state.stepIdx];
            if (currentStepObj && currentStepObj.voiceText) {
                speakText(currentStepObj.voiceText);
            }
        }

        /**************************************************************
         * 2. HIỆU ỨNG PHÁO HOA GIẤY (CONFETTI)
         **************************************************************/
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#eab308'];
            for (let i = 0; i < 85; i++) {
                pieces.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 200,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: -Math.random() * 16 - 5,
                    size: Math.random() * 10 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vrot: (Math.random() - 0.5) * 12
                });
            }

            let frame = 0;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.42; // gravity
                    p.rot += p.vrot;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                    ctx.restore();
                });
                frame++;
                if (frame < 100) {
                    requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            render();
        }

        /**************************************************************
         * 3. KHO HÌNH MINH HỌA SVG TRỰC QUAN CHO HỌC SINH TIỂU HỌC

            </svg>`,
            charcoalDraw: `<svg viewBox="0 0 180 120" class="w-40 h-28 mx-auto">

        function rewardStar(key, points = 1) {
            if (!state.rewardedKeys[key]) {
                state.rewardedKeys[key] = true;
                state.stars += points;
                const el = document.getElementById('star-count');
                el.textContent = state.stars;
                el.parentElement.classList.add('scale-110');
                setTimeout(() => el.parentElement.classList.remove('scale-110'), 300);
            }
        }

        function showFeedback(isCorrect, message) {
            const banner = document.getElementById('feedback-banner');
            banner.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-300', 'text-emerald-900', 'bg-rose-50', 'border-rose-300', 'text-rose-900');
            banner.classList.add('flex');
            if (isCorrect) {
                banner.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
                banner.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-9 h-9 rounded-full bg-emerald-500 text-white flex items-center justify-center font-black text-xl shrink-0">✓</span>
                        <span class="font-extrabold text-base sm:text-lg">${message}</span>
                    </div>
                    <span class="text-xs sm:text-sm font-black bg-amber-200 text-amber-900 px-3 py-1 rounded-full shrink-0">+1 Sao thưởng ⭐</span>
                `;
            } else {
                banner.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-900');
                banner.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-9 h-9 rounded-full bg-rose-500 text-white flex items-center justify-center font-black text-xl shrink-0">!</span>
                        <span class="font-extrabold text-base sm:text-lg">${message}</span>
                    </div>
                `;
            }
        }

        function hideFeedback() {
            const banner = document.getElementById('feedback-banner');
            banner.classList.add('hidden');
            banner.classList.remove('flex');
        }

        /**************************************************************
         * 10. ĐIỀU HƯỚNG CHẶNG & BƯỚC (STAGE & STEP NAVIGATION)
         **************************************************************/
        function goToStage(sIdx, stIdx = 0) {
            playSound('click');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            state.stageIdx = sIdx;
            state.stepIdx = stIdx;
            hideFeedback();
            renderApp();
        }

        function prevStep() {
            playSound('click');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            hideFeedback();
            if (state.stepIdx > 0) {
                state.stepIdx--;
            } else if (state.stageIdx > 0) {
                state.stageIdx--;
                state.stepIdx = STAGES[state.stageIdx].steps.length - 1;
            }
            renderApp();
        }

        function nextStep() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            hideFeedback();
            const currentStage = STAGES[state.stageIdx];
            if (state.stepIdx < currentStage.steps.length - 1) {
                playSound('click');
                state.stepIdx++;
                renderApp();
            } else if (state.stageIdx < STAGES.length - 1) {
                playSound('fanfare');
                launchConfetti();
                state.stageIdx++;
                state.stepIdx = 0;
                renderApp();
            } else {
                celebrateFinish();
            }
        }

        function renderApp() {
            const currentStage = STAGES[state.stageIdx];
            const currentStep = currentStage.steps[state.stepIdx];

            // 1. Render thanh Chặng trên Desktop & Mobile
            const tabsHtml = STAGES.map((st, idx) => {
                const isActive = idx === state.stageIdx;
                return `
                    <button onclick="goToStage(${idx}, 0)"
                        class="px-3.5 py-1.5 rounded-xl font-black text-sm sm:text-base transition-all flex items-center gap-1.5 ${
                            isActive
                                ? `bg-gradient-to-r ${st.color} text-white shadow`
                                : 'text-slate-600 hover:bg-white'
                        }">
                        <span>${st.title}</span>
                    </button>
                `;
            }).join('');
            document.getElementById('stage-tabs').innerHTML = tabsHtml;
            document.getElementById('stage-tabs-mobile').innerHTML = tabsHtml;

            // 2. Render Tiêu đề bước hiện tại
            document.getElementById('step-header').innerHTML = `
                <div class="flex flex-col">
                    <div class="flex items-center gap-2">
                        <span class="px-2.5 py-0.5 rounded-lg text-xs font-black uppercase border ${currentStage.badgeBg}">
                            ${currentStage.title} • Bước ${state.stepIdx + 1}/${currentStage.steps.length}
                        </span>
                    </div>
                    <h2 class="text-lg sm:text-2xl font-black text-slate-900 mt-1 leading-tight">
                        ${currentStep.title}
                    </h2>
                    <p class="text-sm sm:text-base font-bold text-slate-600">
                        ${currentStep.subtitle}
                    </p>
                </div>
            `;

            // 3. Render Nội dung bước hiện tại
            const bodyEl = document.getElementById('step-body');
            currentStep.render(bodyEl);

            // 4. Render Thanh chấm tiến trình dưới cùng
            const dotsHtml = currentStage.steps.map((_, idx) => {
                const active = idx === state.stepIdx;
                return `
                    <button onclick="goToStage(${state.stageIdx}, ${idx})"
                        title="Bước ${idx + 1}"
                        class="h-3.5 rounded-full transition-all ${
                            active ? 'w-9 bg-sky-600' : 'w-3.5 bg-slate-300 hover:bg-slate-400'
                        }"></button>
                `;
            }).join('');
            document.getElementById('step-dots').innerHTML = dotsHtml;
            document.getElementById('step-counter-text').textContent =
                `${currentStage.title} — Bước ${state.stepIdx + 1} / ${currentStage.steps.length}`;

            // 5. Trạng thái nút Quay lại & Tiếp theo
            const btnPrev = document.getElementById('btn-prev');
            btnPrev.disabled = (state.stageIdx === 0 && state.stepIdx === 0);

            const btnNextText = document.getElementById('btn-next-text');
            const isLastStepOfStage = state.stepIdx === currentStage.steps.length - 1;
            const isLastStage = state.stageIdx === STAGES.length - 1;

            if (isLastStepOfStage && !isLastStage) {
                btnNextText.textContent = `Sang ${STAGES[state.stageIdx + 1].title} 🎉`;
            } else if (isLastStepOfStage && isLastStage) {
                btnNextText.textContent = 'Hoàn thành bài học 🏆';
            } else {
                btnNextText.textContent = 'Tiếp theo';
            }
        }

        // Khởi chạy ứng dụng khi tải xong trang
        window.onload = function () {
            renderApp();
        };
    </script>
</body>
</html>
