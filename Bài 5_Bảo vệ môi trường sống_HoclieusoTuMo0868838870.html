<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Bài 4 - Bảo vệ cái đúng, cái tốt</title><style>
:root{--teal:#087e9d;--blue:#207eb3;--orange:#ff9719;--green:#2d9c62;--ink:#183b4b}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#e8f4f7;color:var(--ink);font-family:'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;font-weight:700}.app{min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(150deg,#f7fdff,#eaf7ff)}.top{background:white;padding:10px 2.2vw;display:flex;align-items:center;gap:18px;box-shadow:0 3px 14px #16475e1a}.brand{font-size:clamp(16px,1.55vw,27px);font-weight:900;color:var(--teal)}.progress{flex:1;height:12px;background:#dceff0;border-radius:30px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#44bdb4,#f4ba3f);transition:width .3s}.count{font-size:clamp(15px,1.35vw,24px)}.iconbtn{border:0;background:#eaf5f8;color:#17516b;border-radius:12px;padding:9px 13px;cursor:pointer;font-size:clamp(16px,1.4vw,25px)}.stages{display:flex;gap:10px;padding:9px 2vw 0;justify-content:center}.stage{border:2px solid #d3e5ed;background:white;color:#718d9a;padding:10px 25px;border-radius:100px;font-weight:900;font-size:clamp(13px,1.3vw,22px);cursor:pointer}.stage.on{background:#087e9d;color:white;border-color:#087e9d}.stage.done{border-color:#48b48a;color:#167653}.workspace{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:1.3vh 3vw}.panel{width:100%;max-width:1660px;min-height:65vh;max-height:76vh;background:white;box-shadow:0 16px 50px #22618018;border-radius:34px;padding:clamp(18px,2.6vw,48px);display:flex;flex-direction:column;overflow:auto}.eyebrow{font-size:clamp(16px,1.45vw,26px);color:#e1850f;margin:0 0 5px}.title{font-size:clamp(31px,3.1vw,59px);line-height:1.16;color:#087e9d;margin:0 0 clamp(12px,2vh,26px);font-weight:900}.prompt{font-size:clamp(24px,2.22vw,43px);line-height:1.38;margin:0;color:#243f4b}.content{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}.imageSplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:3.5vw;align-items:center;flex:1}.picture{display:flex;justify-content:center;align-items:center;min-height:0;max-height:48vh}.picture img{max-width:100%;max-height:48vh;object-fit:contain;border-radius:24px;border:3px solid #edf5f4}.qbox{display:flex;flex-direction:column;gap:18px}.options{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.option{font-family:inherit;text-align:left;border:3px solid #d6edf3;background:#f5fbfc;border-radius:22px;padding:clamp(13px,1.5vw,27px);font-size:clamp(20px,1.75vw,32px);font-weight:800;line-height:1.34;cursor:pointer;color:#254455}.option:hover{border-color:#55b0cc}.option.chosen{border-color:#1c8fb3;background:#e1f3fc}.option.good{border-color:#28a769;background:#e1f9e8}.option.bad{border-color:#e85a60;background:#ffe9ea}.feedback{margin-top:18px;border-radius:16px;padding:16px 20px;font-size:clamp(19px,1.7vw,31px);background:#e6f7ed;color:#136c3d}.feedback.no{background:#fff0e6;color:#9b481c}.hint{margin-top:16px;padding:16px 22px;background:#fff6de;border-left:8px solid #ffb544;border-radius:13px;font-size:clamp(20px,1.85vw,34px);line-height:1.36}.hintBtn{align-self:flex-start;margin-top:22px;color:#80550d;background:#ffedbf;border:0;padding:12px 25px;border-radius:30px;font-size:clamp(18px,1.5vw,26px);font-family:inherit;font-weight:900;cursor:pointer}.points{display:grid;gap:15px;margin:25px 0 0;padding:0;list-style:none}.points li{font-size:clamp(23px,2vw,40px);border-radius:15px;background:#eaf8f3;padding:15px 23px}.points li:before{content:'✓ ';color:var(--green)}.story{font-size:clamp(22px,2vw,38px);line-height:1.48;font-weight:700}.question{margin-top:20px;color:#087e9d;font-size:clamp(24px,2vw,40px)}textarea{font-family:inherit;font-size:clamp(21px,1.8vw,32px);width:100%;min-height:120px;max-height:28vh;resize:vertical;border:3px solid #d4e9ef;border-radius:18px;padding:17px;margin-top:22px}.center{text-align:center;align-items:center}.center .content{align-items:center}.huge{font-size:clamp(42px,5vw,95px);color:var(--teal)}.bigEmoji{font-size:clamp(60px,8vw,135px)}.footer{display:flex;align-items:center;justify-content:space-between;padding:12px 3vw 16px;gap:15px}.nav{background:#f7a11b;color:white;border:none;border-radius:20px;padding:clamp(12px,1.3vw,22px) clamp(24px,3vw,55px);font:900 clamp(20px,1.8vw,32px) inherit;cursor:pointer;box-shadow:0 5px 0 #d5810d}.nav.prev{background:#ecf8fc;color:#2b7391;box-shadow:none}.nav:disabled{opacity:.35;cursor:default}.footerNote{color:#527e88;font-size:clamp(15px,1.3vw,24px);text-align:center}.minitags{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:28px 0}.tag{background:#e2f7ed;border-radius:30px;padding:14px 20px;font-size:clamp(18px,1.7vw,31px);color:#22815d}@media(max-width:850px){.stages{flex-wrap:wrap}.stage{padding:8px 12px}.panel{max-height:none;min-height:62vh}.imageSplit{grid-template-columns:1fr;gap:12px}.picture{max-height:27vh}.picture img{max-height:27vh}.options{grid-template-columns:1fr}.workspace{align-items:stretch}.prompt{font-size:clamp(20px,3vw,30px)}.title{font-size:clamp(25px,4vw,40px)}}@media(max-height:700px){.panel{min-height:60vh;max-height:76vh}.top{padding:6px 2vw}.stage{padding:6px 14px}.workspace{padding:1vh 3vw}.panel{padding:1.8vw}.footer{padding:5px 3vw}}

/* Typography optimized for Vietnamese primary pupils and TV projection */
body,button,textarea{font-family:'Arial Rounded MT Bold','Trebuchet MS','Verdana','Arial',sans-serif!important;font-weight:800;letter-spacing:.005em}
.panel{max-height:80vh;min-height:67vh;padding:clamp(16px,2.05vw,39px)}
.title{font-size:clamp(34px,3.5vw,66px);line-height:1.2}
.prompt{font-size:clamp(27px,2.55vw,49px);line-height:1.4}
.option{font-size:clamp(23px,2.02vw,38px);line-height:1.38;padding:clamp(14px,1.5vw,25px);font-weight:900}
.options{gap:13px;margin-top:20px}
.story{font-size:clamp(25px,2.27vw,43px);line-height:1.45}
.question{font-size:clamp(27px,2.33vw,45px)}
.points li{font-size:clamp(26px,2.25vw,44px);line-height:1.35;padding:12px 20px}
.hint{font-size:clamp(23px,2.12vw,40px)}
.feedback{font-size:clamp(22px,1.94vw,37px)}
.hintBtn{font-size:clamp(21px,1.72vw,31px)}
textarea{font-size:clamp(24px,2.05vw,38px)}
.stage{font-size:clamp(16px,1.48vw,27px);padding:9px 21px}
.brand{font-size:clamp(18px,1.7vw,30px)}
.count{font-size:clamp(18px,1.5vw,28px)}
.nav{font-family:inherit;font-size:clamp(22px,2vw,37px);font-weight:900}
.footerNote{font-size:clamp(16px,1.42vw,26px)}
.tag{font-size:clamp(21px,1.92vw,36px)}
.eyebrow{font-size:clamp(18px,1.6vw,29px)}
@media(max-width:850px){.title{font-size:clamp(28px,4.4vw,46px)}.prompt{font-size:clamp(23px,3.4vw,37px)}.option{font-size:clamp(21px,3vw,33px)}.stage{padding:7px 11px}}
@media(max-height:700px){.panel{max-height:78vh;padding:clamp(12px,1.7vw,30px)}.options{margin-top:11px;gap:9px}.option{padding:10px 14px}.title{margin-bottom:9px}}

ống.", "Sông, hồ, biển là nơi sinh sống của nhiều loài sinh vật."], "correct": 2, "explain": "Môi trường nước bao gồm sông, suối, ao, hồ, biển và các hệ sinh thái dưới nước."}, {"stage": 1, "type": "choice", "title": "Em nhận biết môi trường không khí", "prompt": "Không khí quan trọng đối với sự sống vì sao?", "options": ["Nhiều loài sinh vật cần khí ô-xi để hô hấp.", "Không khí chỉ cần cho các loài chim.", "Không khí chỉ có tác dụng làm mát."], "correct": 0, "explain": "Không khí cung cấp các chất khí cần thiết cho sự sống và ảnh hưởng đến môi trường."}, {"stage": 1, "type": "reveal", "title": "Ba loại môi trường sống chủ yếu", "prompt": "Các môi trường đất, nước, không khí có quan hệ mật thiết và đều cần được bảo vệ.", "points": ["Môi trường đất: đất đai, nơi ở và sinh trưởng của sinh vật.", "Môi trường nước: sông, hồ, biển, ao và các nguồn nước.", "Môi trường không khí: không khí bao quanh chúng ta."]}, {"stage": 1, "type": "story", "title": "Thông tin: Môi trường đang bị ô nhiễm", "prompt": "Ô nhiễm môi trường làm suy giảm chất lượng đất, nước, không khí. Khói bụi, tiếng ồn, rác thải, nước bẩn… có thể gây hại đến sức khỏe con người và các loài sinh vật.", "question": "Hãy nêu hai hậu quả của ô nhiễm môi trường mà em biết.", "hint": "Gây bệnh về đường hô hấp, nguồn nước mất vệ sinh, sinh vật bị ảnh hưởng, tiếng ồn gây mệt mỏi…"}, {"stage": 1, "type": "choice", "title": "Vì sao phải bảo vệ môi trường?", "prompt": "Lí do nào đầy đủ nhất?", "options": ["Chủ yếu để đường phố trông đẹp hơn.", "Để bảo vệ sức khỏe, sự sống và chất lượng cuộc sống.", "Để có thể xây thêm nhiều công trình."], "correct": 1, "explain": "Bảo vệ môi trường là bảo vệ sức khỏe, hệ sinh thái và tương lai của chúng ta."}, {"stage": 1, "type": "picture", "title": "Tranh 1: Trồng cây", "image": "cleanup", "prompt": "Các bạn nhỏ đang làm gì? Việc đó mang lại lợi ích gì?", "hint": "Trồng và chăm sóc cây làm cho môi trường xanh, sạch, đẹp."}, {"stage": 1, "type": "picture", "title": "Tranh 2: Khói bụi", "image": "smoke", "prompt": "Bạn nhỏ đã nhắc điều gì khi thấy đốt rác? Vì sao?", "hint": "Đốt rác có thể gây khói bụi, ảnh hưởng không khí và sức khỏe; cần khuyên dừng việc đốt rác."}, {"stage": 1, "type": "picture", "title": "Tranh 3: Làm sạch khu phố", "image": "cleanstreet", "prompt": "Các bạn tham gia hoạt động nào? Em có thể cùng làm không?", "hint": "Cùng thu gom rác, giữ đường phố sạch sẽ; chú ý an toàn, tránh rác sắc nhọn."}, {"stage": 1, "type": "picture", "title": "Tranh 4: Phân loại rác", "image": "bins", "prompt": "Theo em, vì sao nên phân loại rác trước khi bỏ?", "hint": "Phân loại giúp thuận lợi trong xử lí, tái chế và giảm ô nhiễm."}, {"stage": 1, "type": "picture", "title": "Tranh 5: Không đổ dầu thừa", "image": "wash", "prompt": "Vì sao bạn nhỏ không đổ dầu ăn thừa xuống cống?", "hint": "Dầu mỡ có thể gây tắc cống và làm ô nhiễm nước."}, {"stage": 1, "type": "picture", "title": "Tranh 6: Mang túi dùng nhiều lần", "image": "bag", "prompt": "Mang túi dùng nhiều lần giúp bảo vệ môi trường thế nào?", "hint": "Giảm tiêu thụ túi ni-lông dùng một lần."}, {"stage": 1, "type": "picture", "title": "Tranh 7: Tái sử dụng chai nhựa", "image": "recycle", "prompt": "Hai bạn sử dụng chai, lọ đã qua sử dụng để làm gì?", "hint": "Tái sử dụng, làm đồ có ích, giảm rác thải."}, {"stage": 1, "type": "picture", "title": "Tranh 8: Dọn vệ sinh nơi công cộng", "image": "dog", "prompt": "Bạn nhỏ đã làm gì khi thú nuôi gây mất vệ sinh?", "hint": "Thu dọn chất thải vật nuôi và bỏ vào nơi phù hợp."}, {"stage": 1, "type": "reveal", "title": "Ghi nhớ: Em có thể làm gì?", "prompt": "Bảo vệ môi trường bắt đầu từ những hành động nhỏ, đúng cách và được duy trì mỗi ngày.", "points": ["Không xả rác; phân loại và bỏ rác đúng nơi.", "Tiết kiệm nước, điện; hạn chế đồ dùng một lần.", "Chăm sóc cây xanh; tuyên truyền và nhắc nhở lịch sự.", "Báo người lớn khi thấy hành vi gây ô nhiễm hoặc nguy hiểm."]}, {"stage": 2, "type": "section", "title": "LUYỆN TẬP", "prompt": "Hãy suy nghĩ, lựa chọn và giải thích. Chúng ta học từ cả câu trả lời chưa đúng!"}, {"stage": 2, "type": "picture", "title": "Trò chơi: Nếu… thì…", "image": "classgame", "prompt": "Nếu đổ rác xuống sông thì điều gì có thể xảy ra? Em hãy nói tiếp câu “Nếu… thì…”.", "hint": "Nếu đổ rác xuống sông thì nguồn nước có thể ô nhiễm, gây hại cho sinh vật và con người."}, {"stage": 2, "type": "choice", "title": "Nếu cây xanh bị chặt phá…", "prompt": "Hậu quả nào hợp lí nhất?", "options": ["Không khí và nơi sống của nhiều sinh vật có thể bị ảnh hưởng.", "Môi trường chắc chắn sẽ sạch hơn vì ít lá rụng.", "Không ảnh hưởng đến môi trường nếu còn cây trong công viên."], "correct": 0, "explain": "Cây xanh có vai trò quan trọng với hệ sinh thái và không khí."}, {"stage": 2, "type": "choice", "title": "Vì sao cần phân loại rác?", "prompt": "Phân loại rác từ đầu có lợi gì?", "options": ["Chỉ để thùng rác nhiều màu sắc hơn.", "Giúp rác biến mất ngay mà không cần xử lí.", "Thuận lợi cho tái chế, thu gom và xử lí phù hợp."], "correct": 2, "explain": "Phân loại đúng góp phần giảm ô nhiễm và tiết kiệm tài nguyên."}, {"stage": 2, "type": "choice", "title": "Trồng cây xanh", "prompt": "Ý kiến nào chính xác nhất về việc trồng cây?", "options": ["Chỉ cần trồng cây một lần, không cần chăm sóc.", "Cần chọn cây phù hợp và chăm sóc để cây phát triển tốt.", "Nên trồng cây ở mọi nơi, kể cả giữa lối đi."], "correct": 1, "explain": "Trồng cây cần đúng nơi, đúng cách và chăm sóc thường xuyên."}, {"stage": 2, "type": "choice", "title": "Sử dụng đồ dùng", "prompt": "Em muốn giảm rác thải nhựa khi đi mua đồ. Cách nào phù hợp nhất?", "options": ["Mang túi vải hoặc túi có thể dùng nhiều lần.", "Xin thêm một túi ni-lông để phòng khi không cần dùng.", "Dùng túi ni-lông rồi bỏ cùng rác tái chế dù túi bị dính bẩn."], "correct": 0, "explain": "Tái sử dụng túi giúp giảm lượng nhựa dùng một lần."}, {"stage": 2, "type": "choice", "title": "Ở nơi công cộng", "prompt": "Thấy một người vứt rác không đúng nơi, em nên làm gì?", "options": ["La hét để họ xấu hổ trước mọi người.", "Bỏ qua vì mình không quen biết.", "Nhắc nhở lịch sự khi an toàn hoặc báo người lớn."], "correct": 2, "explain": "Bảo vệ môi trường cần cách ứng xử văn minh, phù hợp và an toàn."}, {"stage": 2, "type": "choice", "title": "Bạn An xem phim về môi trường", "prompt": "Bạn An thường xem phim, đọc sách về bảo vệ môi trường. Em đánh giá thế nào?", "options": ["Đó là việc tốt nếu bạn vận dụng kiến thức vào hành động.", "Không có ích vì chỉ đọc sách không thể thay đổi mọi thứ.", "Đã đủ để bảo vệ môi trường, không cần việc làm khác."], "correct": 0, "explain": "Tìm hiểu kiến thức giúp chúng ta biết cách hành động đúng."}, {"stage": 2, "type": "choice", "title": "Xử lí rác sau khi phun thuốc", "prompt": "Sau khi phun thuốc trừ sâu, có người muốn vứt vỏ chai ra vườn. Em nên khuyên gì?", "options": ["Chôn vỏ chai ngay cạnh nguồn nước.", "Thu gom và xử lí theo hướng dẫn dành cho bao bì hóa chất.", "Rửa vỏ chai rồi dùng đựng nước uống."], "correct": 1, "explain": "Bao bì hóa chất có nguy cơ độc hại, không được tự ý tái sử dụng hay vứt bừa bãi."}, {"stage": 2, "type": "choice", "title": "Giữ sạch nguồn nước", "prompt": "Nhận xét nào đúng về hành vi thả túi ni-lông xuống sông?", "options": ["Có thể chấp nhận nếu chỉ một chiếc túi.", "Không ảnh hưởng vì nước sông chảy liên tục.", "Không nên vì gây ô nhiễm và có thể hại sinh vật."], "correct": 2, "explain": "Không xả túi ni-lông xuống sông, hồ và nguồn nước."}, {"stage": 2, "type": "talk", "title": "Nên làm hay không nên làm?", "prompt": "Một số người đốt rơm rạ sau thu hoạch. Em đồng tình không? Vì sao?", "hint": "Không nên đốt bừa bãi; khói bụi ảnh hưởng sức khỏe và không khí. Cần chọn biện pháp xử lí phù hợp."}, {"stage": 2, "type": "talk", "title": "Nên làm hay không nên làm?", "prompt": "Bạn Kim báo tổ trưởng dân phố khi có người vứt rác sai quy định. Em nhận xét thế nào?", "hint": "Đó là cách thông báo cho người có trách nhiệm, phù hợp khi không thể tự xử lí."}, {"stage": 2, "type": "talk", "title": "Nên làm hay không nên làm?", "prompt": "Một bạn đề nghị người đàn ông không hút thuốc trên xe buýt. Em có đồng tình không?", "hint": "Đồng tình với việc bảo vệ không gian chung; cần nhắc nhẹ nhàng hoặc nhờ người có trách nhiệm."}, {"stage": 2, "type": "picture", "title": "Tình huống: Bỏ rác xuống sông", "image": "bridge", "prompt": "Một bạn định vứt rác xuống sông, bạn khác nhắc dừng lại. Em sẽ nói gì?", "hint": "Khuyên bạn giữ rác đến khi có thùng rác, không làm ô nhiễm nguồn nước."}, {"stage": 2, "type": "picture", "title": "Tình huống: Đốt rác ở đường làng", "image": "sweeping", "prompt": "Sau khi quét đường, có bạn muốn gom rác để đốt. Em nên làm gì?", "hint": "Khuyên các bạn thu gom, phân loại và chuyển rác đến nơi xử lí, không đốt rác bừa bãi."}, {"stage": 2, "type": "picture", "title": "Tình huống: Chăn nuôi gây ô nhiễm", "image": "farm", "prompt": "Người lớn nói thả vật nuôi quanh nhà là thói quen cũ. Em sẽ góp ý thế nào?", "hint": "Giải thích nguy cơ ô nhiễm từ chất thải, đề nghị có nơi nuôi và xử lí chất thải hợp vệ sinh."}, {"stage": 2, "type": "picture", "title": "Tình huống: Bẻ lá trong sân trường", "image": "leaves", "prompt": "Bạn muốn bẻ nhiều lá cây để quạt cho mát. Em sẽ nói gì?", "hint": "Khuyên bạn không bẻ lá, bảo vệ cây xanh và chọn cách khác để làm mát."}, {"stage": 2, "type": "picture", "title": "Tình huống: Karaoke quá lớn", "image": "karaoke", "prompt": "Bạn mở loa rất to làm hàng xóm khó chịu. Em sẽ góp ý ra sao?", "hint": "Nhắc bạn giảm âm lượng, chọn giờ phù hợp, tôn trọng người xung quanh vì tiếng ồn cũng gây ô nhiễm."}, {"stage": 3, "type": "section", "title": "VẬN DỤNG", "prompt": "Mỗi bạn đều có thể góp phần làm môi trường sống xanh hơn."}, {"stage": 3, "type": "talk", "title": "Tự đánh giá việc làm của em", "prompt": "Em đã làm tốt điều gì để bảo vệ môi trường? Điều gì em cần thay đổi từ hôm nay?", "hint": "Gợi ý: tiết kiệm nước, điện; không xả rác; hạn chế túi ni-lông; chăm sóc cây xanh."}, {"stage": 3, "type": "talk", "title": "Dự án nhóm: Môi trường địa phương", "prompt": "Cùng nhóm đề xuất một bài thuyết trình: Thực trạng – Vì sao cần bảo vệ – Những hành động cụ thể.", "hint": "Quan sát tình hình thật, nêu nguyên nhân, đưa ra việc có thể làm; trình bày bằng tranh, ảnh và lời nói."}, {"stage": 3, "type": "talk", "title": "Điều tra môi trường quanh trường", "prompt": "Chọn một vấn đề môi trường quanh em. Nêu nguyên nhân và một biện pháp cải thiện phù hợp.", "hint": "Ví dụ: rác quanh sân trường → thiếu ý thức bỏ rác → thêm biển nhắc, phân loại rác, trực nhật theo nhóm."}, {"stage": 3, "type": "reveal", "title": "Thông điệp của bài học", "prompt": "MÔI TRƯỜNG LÀ CỦA CHÚNG TA – GIỮ GÌN, BẢO VỆ MỚI LÀ VĂN MINH.", "points": ["Em nhận biết được môi trường đất, nước, không khí.", "Em hiểu tác hại của ô nhiễm và vì sao cần bảo vệ.", "Em biết lựa chọn hành động đúng ở nhà, trường và nơi công cộng."]}, {"stage": 3, "type": "finish", "title": "EM LÀ NGƯỜI BẢO VỆ MÔI TRƯỜNG!", "prompt": "Chúc mừng em đã hoàn thành Bài 5. Hãy thực hiện ít nhất một hành động xanh ngay hôm nay!"}];const images={"environment": "data:image/webp;base64,UklGRoAnAABXRUJQVlA4IHQnAACwvwCdASqLAWABPl0skkajoqGhJDIKqHALiWNuy2Bz5/bRsn/1vch+x/4/+U/c/21ra/l/7h69d6j1T/W813qT/u+sD/cftD7tP0X/3fz/+gr9Y/1z9eD1y/3j/r/kB8Hf57/ov2+95X/l+uD/DeoP/Uv+X1rfoieXf+7Xw9f1X/pful7Xn//1gP1D2s+C/pH+fy9jl/5x+gslHMB56ah3tXgZQE/qHEpp752HwUpUiTOk4lH+41rDv6Wk/DYMLMlTtStc1CpA5+fkPYBm9PtdhAzzBpXuXiftcozRqo9dGJtpz1J/8DEST72Ay2Ng8rUhw60MbPpEi32XM9gMtb+SgzytSHGg1zzv6zB5WpDssgzF2aLqc0HlakOW2iNEPvYDLY2D0lWXM9gMsyKxe+s6zyr35FwLeNpS5tSFqpDsuZ7AZa/jzfEGTAxKSp6RYwHdXV8U97iKkDFmftuQYb5tG3fFtB9zkVK+/efD1jNlv5DEn3sBlsa9LLdLv5oLVqfepMPajfqgGVvS8DwFwcpUcbyLQbWN6Dl0Y9NZ/vzwlgmnMq3nl2M4nXFXhdtfckfQw1oGWxsHlahvx247ypGjzJd0Pp1AJZX15bDuNu2YEKOrdo8tQtFUOJyvNy5X0U0r5z/fCmB4z7aSpN17GweTzxMp6B1E7/+wPDDJrGv/lJzp96dRydjFJVRQ/VMgTG+rhGYNsXsqth0mkYuezn7ud+re26rms49R9cPL/s9gMD31Kk17uz9dkrWJrvEflqXNslQMM78oiD6OEbVxgTnk5VHIcaKvAU7VqyZMTsPUUAf/dd7xB9RtDUOg3hukrG06lvi41juzh+evnALNpXGl+ else if(s.type==='reveal')body=`<h1 class="title">${escapeHtml(s.title)}</h1><div class="content"><p class="prompt">${q}</p><ul class="points">${s.points.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>`;
else if(s.type==='story')body=`<h1 class="title">${escapeHtml(s.title)}</h1><div class="content"><div class="story">${q}</div><div class="question">❓ ${escapeHtml(s.question)}</div><button class="hintBtn" id="hintbtn">💡 ${hints[index]?'Ẩn gợi ý':'Xem gợi ý'}</button>${hints[index]?`<div class="hint">${escapeHtml(s.hint)}</div>`:''}</div>`;
else if(s.type==='talk')body=`<h1 class="title">${escapeHtml(s.title)}</h1><div class="content"><p class="prompt">${q}</p><textarea id="response" placeholder="Em có thể ghi ý kiến tại đây hoặc phát biểu trước lớp..."></textarea><button class="hintBtn" id="hintbtn">💡 ${hints[index]?'Ẩn gợi ý':'Xem gợi ý'}</button>${hints[index]?`<div class="hint">${escapeHtml(s.hint)}</div>`:''}</div>`;
$('panel').innerHTML=body;document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answer(+b.dataset.opt));if($('hintbtn'))$('hintbtn').onclick=hint;const resp=$('response');if(resp){resp.value=notes[index]||'';resp.oninput=()=>{notes[index]=resp.value}};$('footerNote').textContent=`${names[s.stage]} • ${index+1}/${slides.length} • Phím ← → để chuyển màn hình`;
}
$('prev').onclick=()=>go(index-1);$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};$('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};window.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key.toLowerCase()==='f')$('full').click()});render();
</script></body></html>
