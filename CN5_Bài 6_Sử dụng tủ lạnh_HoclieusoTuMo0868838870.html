<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 6: Sử Dụng Tủ Lạnh - Công Nghệ 5</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Nunito & Quicksand (Chữ không chân, tròn đều, đậm nét, hỗ trợ Tiếng Việt hoàn hảo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,700;0,800;0,900;1,700&family=Quicksand:wght@700&display=swap&subset=vietnamese" rel="stylesheet">
    <style>
        :root {
            --font-primary: 'Nunito', 'Quicksand', system-ui, -apple-system, sans-serif;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            font-family: var(--font-primary);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f2fe 0%, #ecfeff 50%, #f0fdf4 100%);
            color: #0f172a;
        }
        /* Hệ thống cỡ chữ tối ưu cho trình chiếu Tivi lớp học */
        body.tv-normal {
            --title-size: clamp(1.45rem, 2.2vw, 2.05rem);
            --subtitle-size: clamp(1.05rem, 1.4vw, 1.32rem);
            --card-title: clamp(1.2rem, 1.68vw, 1.58rem);
            --body-size: clamp(1.08rem, 1.48vw, 1.4rem);
            --option-size: clamp(1.1rem, 1.52vw, 1.42rem);
            --badge-size: clamp(0.9rem, 1.12vw, 1.08rem);
        }
        body.tv-large {
            --title-size: clamp(1.62rem, 2.45vw, 2.3rem);
            --subtitle-size: clamp(1.15rem, 1.6vw, 1.48rem);
            --card-title: clamp(1.32rem, 1.9vw, 1.78rem);
            --body-size: clamp(1.2rem, 1.66vw, 1.56rem);
            --option-size: clamp(1.22rem, 1.7vw, 1.6rem);
            --badge-size: clamp(0.98rem, 1.22vw, 1.18rem);
        }
        body.tv-xlarge {
            --title-size: clamp(1.8rem, 2.75vw, 2.55rem);
            --subtitle-size: clamp(1.26rem, 1.75vw, 1.62rem);
            --card-title: clamp(1.46rem, 2.1vw, 1.96rem);
            --body-size: clamp(1.32rem, 1.85vw, 1.72rem);
            --option-size: clamp(1.34rem, 1.9vw, 1.76rem);
            --badge-size: clamp(1.06rem, 1.32vw, 1.28rem);
        }
        .tv-title { font-size: var(--title-size); line-height: 1.22; font-weight: 900; }
        .tv-subtitle { font-size: var(--subtitle-size); line-height: 1.34; font-weight: 800; }
        .tv-card-title { font-size: var(--card-title); line-height: 1.28; font-weight: 900; }
        .tv-body { font-size: var(--body-size); line-height: 1.38; font-weight: 800; }
        .tv-option { font-size: var(--option-size); line-height: 1.35; font-weight: 800; }
        .tv-badge { font-size: var(--badge-size); line-height: 1.2; font-weight: 900; }

        .custom-scroll::-webkit-scrollbar {
            width: 10px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(226, 232, 240, 0.6);
            border-radius: 9999px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #0284c7;
            border-radius: 9999px;
        }
        .btn-kid {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 0 rgba(15, 23, 42, 0.18);
        }
        .btn-kid:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 rgba(15, 23, 42, 0.22);
        }
        .btn-kid:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(15, 23, 42, 0.18);
        }
        .card-kid {
            box-shadow: 0 14px 32px -6px rgba(15, 23, 42, 0.1), 0 8px 14px -6px rgba(15, 23, 42, 0.06);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.97) translateY(6px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .step-enter {
            animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes shakeFridge {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px) rotate(-1deg); }
            75% { transform: translateX(3px) rotate(1deg); }
        }
        .fridge-shake {
            animation: shakeFridge 0.28s infinite;
        }
    </style>
</head>

    <!-- MÃ NGUỒN JAVASCRIPT XỬ LÝ TOÀN BỘ TƯƠNG TÁC BÀI 6: SỬ DỤNG TỦ LẠNH -->
    <script>
        /**************************************************************
         * 1. CHẾ ĐỘ CỠ CHỮ TIVI & HỆ THỐNG ÂM THANH SINH ĐỘNG
         **************************************************************/
        const fontModes = [
            { cls: 'tv-normal', label: 'Chuẩn TV' },
            { cls: 'tv-large', label: 'To (TV)' },
            { cls: 'tv-xlarge', label: 'Siêu to' }
        ];
        let currentFontModeIdx = 1; // Mặc định chọn "To (TV)" cho học sinh bàn cuối nhìn rõ

        function cycleFontSize() {
            playSound('click');
            document.body.classList.remove(fontModes[currentFontModeIdx].cls);
            currentFontModeIdx = (currentFontModeIdx + 1) % fontModes.length;
            document.body.classList.add(fontModes[currentFontModeIdx].cls);
            document.getElementById('font-size-label').textContent = fontModes[currentFontModeIdx].label;
        }

        let soundEnabled = true;
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioCtx();
                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(560, now);
                    osc.frequency.exponentialRampToValueAtTime(860, now + 0.065);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.07);
                } else if (type === 'pop') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(480, now);
                    osc.frequency.exponentialRampToValueAtTime(960, now + 0.1);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.11);
                } else if (type === 'ice') {
                    // Tiếng đá lạnh lách cách trong trẻo
                    [1046.5, 1396.9, 1760].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + i * 0.055);
                        gain.gain.setValueAtTime(0.18, now + i * 0.055);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.055 + 0.14);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.055);
                        osc.stop(now + i * 0.055 + 0.15);
                    });
                } else if (type === 'door') {
                    // Tiếng đóng/mở cửa tủ lạnh êm ái
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.14);
                    gain.gain.setValueAtTime(0.24, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'buzz') {
                    // Tiếng tủ lạnh kêu ù ù bất thường
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(95, now);
                    osc.frequency.setValueAtTime(110, now + 0.12);
                    osc.frequency.setValueAtTime(90, now + 0.24);
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.39);
                } else if (type === 'correct') {
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.075);
                        gain.gain.setValueAtTime(0.24, now + idx * 0.075);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.075 + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.075);
                        osc.stop(now + idx * 0.075 + 0.26);
                    });
                } else if (type === 'wrong') {
                    const notes = [300, 230];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.13);
                        gain.gain.setValueAtTime(0.13, now + idx * 0.13);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.13 + 0.2);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.13);
                        osc.stop(now + idx * 0.13 + 0.21);
                    });
                } else if (type === 'fanfare') {
                    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
                    const times = [0, 0.11, 0.22, 0.33, 0.47, 0.62];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + times[idx]);
                        gain.gain.setValueAtTime(0.25, now + times[idx]);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + times[idx] + 0.32);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + times[idx]);
                        osc.stop(now + times[idx] + 0.33);
                    });
                }
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
            if (soundEnabled) playSound('pop');
        }

        function toggleFullScreen() {
            playSound('click');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'vi-VN';
            utter.rate = 0.95;
            utter.pitch = 1.04;
            const ttsBtn = document.getElementById('tts-label');
            utter.onstart = () => { if (ttsBtn) ttsBtn.textContent = 'Đang đọc...'; };
            utter.onend = () => { if (ttsBtn) ttsBtn.textContent = 'Đọc bài'; };
            utter.onerror = () => { if (ttsBtn) ttsBtn.textContent = 'Đọc bài'; };
            window.speechSynthesis.speak(utter);
        }

        function speakCurrentStep() {
            playSound('pop');
            const currentStepObj = STAGES[state.stageIdx].steps[state.stepIdx];
            if (currentStepObj && currentStepObj.voiceText) {
                speakText(currentStepObj.voiceText);
            }
        }

        /**************************************************************
         * 2. HIỆU ỨNG PHÁO HOA CHÚC MỪNG (CONFETTI)
         **************************************************************/
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#06b6d4', '#10b981', '#f59e0b', '#3b82f6', '#ec4899', '#8b5cf6'];
            for (let i = 0; i < 100; i++) {
                pieces.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 300,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: -Math.random() * 16 - 5,
                    size: Math.random() * 11 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vrot: (Math.random() - 0.5) * 12
                });
            }

            let frame = 0;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.42;
                    p.rot += p.vrot;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                    ctx.restore();
                });
                frame++;
                if (frame < 95) {
                    requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            render();
        }

        function rewardStar(key, points = 1) {
            if (!state.rewardedKeys[key]) {

                state.stars += points;
                const el = document.getElementById('star-count');
                const badge = document.getElementById('star-badge');
                if (el) el.textContent = state.stars;
                if (badge) {
                    badge.classList.add('scale-110');
                    setTimeout(() => badge.classList.remove('scale-110'), 280);
                }
            }
        }

        function showFeedback(isCorrect, message) {
            const banner = document.getElementById('feedback-banner');
            banner.classList.remove('hidden', 'bg-emerald-100', 'border-emerald-500', 'text-emerald-950', 'bg-rose-100', 'border-rose-500', 'text-rose-950');

                    <span class="tv-badge bg-amber-300 text-amber-950 px-4 py-1.5 rounded-full shrink-0 border-2 border-amber-500">+1 Sao ⭐</span>
                `;
            } else {

                showFeedback(true, 'Bước chuẩn bị rất chuẩn! Bây giờ em hãy bấm chọn Khoang tủ lạnh ở bên phải (Bước B) để cất vào nhé!');
                renderApp();
            } else {
                playSound('wrong');
                showFeedback(false, 'Cách chuẩn bị đó chưa an toàn! Em nhớ không để đồ nóng vào tủ và phải bọc kín thực phẩm nhé.');
            }
        }

        function placeFoodInFridge(compartment) {
            const task = CHEF_TASKS[state.chefIdx];
            if (!state.chefPreTreated && !state.chefStepDone[state.chefIdx]) {
                playSound('wrong');
                showFeedback(false, 'Em hãy hoàn thành Bước A (chọn cách chuẩn bị thực phẩm ở bên trái) trước khi đưa vào tủ lạnh nhé!');
                return;
            }
            if (compartment === task.targetCompartment) {
                state.chefStepDone[state.chefIdx] = true;
                playSound('door');
                rewardStar('chef_task_' + state.chefIdx, 1);
                showFeedback(true, task.explain);
                setTimeout(() => {
                    if (state.chefIdx < CHEF_TASKS.length - 1 && !state.chefStepDone[state.chefIdx + 1]) {
                        state.chefIdx++;
                        state.chefPreTreated = state.chefStepDone[state.chefIdx];
                    }
                    renderApp();
                }, 1150);
            } else {
                playSound('wrong');
                showFeedback(false, 'Chưa đúng khoang rồi! Em hãy xem món này cần làm đông đá (< 0 °C) hay chỉ cần giữ mát (1 °C – 7 °C) nhé.');
            }
        }

        // Bước 2/3: Tình huống thực tế tại gia đình
        function renderStep4_2(container) {
            renderPracticeMCQ6(
                container,
                'doctorDone',
                'Tình huống vận dụng thực tế tại gia đình',
                'Cuối tuần, em cùng bố mẹ kiểm tra tủ lạnh của gia đình thì thấy: trong tủ có nhiều hộp đồ ăn xếp chồng chật kín, có vài lát dưa hấu để trần không bọc màng bọc nên tủ bắt đầu có mùi hôi. Em sẽ đề xuất với bố mẹ cách làm nào dưới đây?',
                [
                    {
                        text: 'A. Cùng bố mẹ bỏ bớt thực phẩm đã hỏng, dùng màng bọc hoặc hộp kín cho thức ăn còn tốt, lau vệ sinh sạch các ngăn tủ và đặt thêm vài lát chanh tươi hoặc vỏ cam quýt để khử mùi.',
                        correct: true,
                        explain: 'Hoàn toàn chính xác! Đó là cách làm khoa học giúp tủ lạnh sạch thơm, an toàn vệ sinh thực phẩm và tiết kiệm điện năng.'
                    },
                    {
                        text: 'B. Vặn nhiệt độ khoang làm lạnh xuống mức thấp nhất để đóng băng toàn bộ dưa hấu và các hộp thức ăn cho hết mùi hôi.',
                        correct: false,
                        explain: 'Chưa đúng! Đóng băng khoang làm lạnh sẽ làm hỏng rau quả và không giải quyết được nguyên nhân gây mùi hôi.'
                    },
                    {
                        text: 'C. Mua thêm thật nhiều túi thức ăn mới nhét kín vào các khe hở còn lại để đè bẹp mùi hôi xuống dưới đáy tủ.',
                        correct: false,
                        explain: 'Chưa đúng! Nhét thêm đồ càng làm tủ quá tải, khí lạnh không lưu thông được và thực phẩm càng nhanh hỏng hơn.'
                    }
                ]
            );
        }

        // Bước 3/3: Tổng kết bài học & Trao Huy hiệu (Trang 30)
        function renderStep4_3(container) {
            container.innerHTML = `
                <div class="step-enter max-w-[1480px] mx-auto w-full flex flex-col gap-4">
                    <div class="bg-gradient-to-r from-cyan-100 via-emerald-50 to-amber-100 border-4 border-cyan-400 rounded-3xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <div class="text-5xl sm:text-6xl">🏆🧊</div>
                            <div>
                                <div class="tv-badge uppercase text-cyan-900">Hoàn thành xuất sắc Bài 6: Sử dụng tủ lạnh</div>
                                <h2 class="tv-title text-slate-900">
                                    Huy Hiệu: Chuyên Gia Sử Dụng Tủ Lạnh An Toàn!
                                </h2>
                                <p class="tv-body text-slate-800 mt-1">
                                    Tổng số Sao lớp mình đạt được: <span class="text-amber-600 font-black text-3xl">${state.stars} ⭐</span>
                                </p>
                            </div>
                        </div>
                        <div class="flex gap-3 shrink-0">
                            <button onclick="celebrateFinishLesson6()"
                                class="btn-kid bg-gradient-to-r from-amber-500 to-orange-600 text-white font-black px-5 py-3 rounded-2xl text-lg">
                                🎉 Bắn pháo hoa
                            </button>
                            <button onclick="goToStage(0, 0)"
                                class="btn-kid bg-white hover:bg-cyan-50 text-cyan-950 border-3 border-cyan-400 font-black px-5 py-3 rounded-2xl text-lg">
                                🔄 Học lại từ đầu
                            </button>
                        </div>
                    </div>

                    <!-- Bảng tổng kết kiến thức cốt lõi Bài 6 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-cyan-50 border-4 border-cyan-300 rounded-3xl p-4 sm:p-5">
                            <div class="tv-card-title text-cyan-950 mb-2">❄️ 1. Tác dụng & Các khoang tủ lạnh:</div>
                            <ul class="tv-body text-slate-800 space-y-1.5 list-disc list-inside">
                                <li>Bảo quản thực phẩm ở <b>nhiệt độ thấp</b>, kéo dài thời gian sử dụng.</li>
                                <li><b>Khoang cấp đông (dưới 0 °C):</b> Làm đá & đông lạnh (vài tuần – vài tháng).</li>
                                <li><b>Khoang làm lạnh (1 °C – 7 °C):</b> Bảo quản lạnh (thịt cá từ 3 – 5 ngày, rau củ, sữa,...).</li>
                            </ul>
                        </div>

                        <div class="bg-emerald-50 border-4 border-emerald-300 rounded-3xl p-4 sm:p-5">
                            <div class="tv-card-title text-emerald-950 mb-2">🛡️ 2. Lưu ý bảo quản & Xử lí bất thường:</div>
                            <ul class="tv-body text-slate-800 space-y-1.5 list-disc list-inside">
                                <li><b>Không</b> để đồ còn nóng; <b>không</b> chứa quá nhiều thực phẩm.</li>
                                <li>Dùng <b>màng bọc hoặc hộp đựng</b> kín thực phẩm.</li>
                                <li>Khi tủ có dấu hiệu bất thường (kêu to, mùi hôi, đóng tuyết, chảy nước): <b>Báo ngay cho người lớn</b>.</li>
                                <li>Khử mùi bằng <b>chanh, vỏ cam quýt, bã cà phê</b> & vệ sinh thường xuyên.</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;

            showFeedback(true, 'Em hãy chia sẻ với người thân trong gia đình về cách sắp xếp, bảo quản thực phẩm trong tủ lạnh đúng cách, an toàn nhé!');
        }

        function celebrateFinishLesson6() {
            playSound('fanfare');
            launchConfetti();
            showFeedback(true, 'Chúc mừng các em đã nắm vững toàn bộ kiến thức Bài 6: Sử dụng tủ lạnh!');
        }

        /**************************************************************
         * 9. ĐIỀU HƯỚNG CHẶNG & BƯỚC (STAGE & STEP NAVIGATION)
         **************************************************************/
        function goToStage(sIdx, stIdx = 0) {
            playSound('click');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            state.stageIdx = sIdx;
            state.stepIdx = stIdx;
            hideFeedback();
            renderApp();
        }

        function prevStep() {
            playSound('click');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            hideFeedback();
            if (state.stepIdx > 0) {
                state.stepIdx--;
            } else if (state.stageIdx > 0) {
                state.stageIdx--;
                state.stepIdx = STAGES[state.stageIdx].steps.length - 1;
            }
            renderApp();
        }

        function nextStep() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            hideFeedback();
            const currentStage = STAGES[state.stageIdx];
            if (state.stepIdx < currentStage.steps.length - 1) {
                playSound('click');
                state.stepIdx++;
                renderApp();
            } else if (state.stageIdx < STAGES.length - 1) {
                playSound('fanfare');
                launchConfetti();
                state.stageIdx++;
                state.stepIdx = 0;
                renderApp();
            } else {
                celebrateFinishLesson6();
            }
        }

        function renderApp() {
            const currentStage = STAGES[state.stageIdx];
            const currentStep = currentStage.steps[state.stepIdx];

            // 1. Render 4 nút chuyển chặng trên Header & Mobile
            const tabsHtml = STAGES.map((st, idx) => {
                const isActive = idx === state.stageIdx;
                return `
                    <button onclick="goToStage(${idx}, 0)"
                        class="px-4 py-1.5 rounded-xl font-black text-base sm:text-lg transition-all flex items-center gap-1.5 ${
                            isActive
                                ? `bg-gradient-to-r ${st.color} text-white shadow`
                                : 'text-slate-700 hover:bg-white'
                        }">
                        <span>${st.title}</span>
                    </button>
                `;
            }).join('');
            document.getElementById('stage-tabs').innerHTML = tabsHtml;
            document.getElementById('stage-tabs-mobile').innerHTML = tabsHtml;

            // 2. Render Tiêu đề bước hiện tại (Chữ cực to rõ cho Tivi)
            document.getElementById('step-header').innerHTML = `
                <div class="flex flex-col">
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-0.5 rounded-xl tv-badge uppercase border-2 ${currentStage.badgeBg}">
                            ${currentStage.title} • Bước ${state.stepIdx + 1}/${currentStage.steps.length}
                        </span>
                    </div>
                    <h2 class="tv-title text-slate-900 mt-1">
                        ${currentStep.title}
                    </h2>
                    <p class="tv-subtitle text-slate-700 mt-0.5">
                        ${currentStep.subtitle}
                    </p>
                </div>
            `;

            // 3. Render Nội dung bước hiện tại
            const bodyEl = document.getElementById('step-body');
            currentStep.render(bodyEl);

            // 4. Render Thanh chấm tiến trình dưới cùng
            const dotsHtml = currentStage.steps.map((_, idx) => {
                const active = idx === state.stepIdx;
                return `
                    <button onclick="goToStage(${state.stageIdx}, ${idx})"
                        title="Bước ${idx + 1}"
                        class="h-4 rounded-full transition-all ${
                            active ? 'w-10 bg-cyan-600' : 'w-4 bg-slate-300 hover:bg-slate-400'
                        }"></button>
                `;
            }).join('');
            document.getElementById('step-dots').innerHTML = dotsHtml;
            document.getElementById('step-counter-text').textContent =
                `${currentStage.title} — Bước ${state.stepIdx + 1} / ${currentStage.steps.length}`;

            // 5. Cập nhật trạng thái nút Quay lại & Tiếp theo
            const btnPrev = document.getElementById('btn-prev');
            btnPrev.disabled = (state.stageIdx === 0 && state.stepIdx === 0);

            const btnNextText = document.getElementById('btn-next-text');
            const isLastStepOfStage = state.stepIdx === currentStage.steps.length - 1;
            const isLastStage = state.stageIdx === STAGES.length - 1;

            if (isLastStepOfStage && !isLastStage) {
                btnNextText.textContent = `Sang ${STAGES[state.stageIdx + 1].title} 🎉`;
            } else if (isLastStepOfStage && isLastStage) {
                btnNextText.textContent = 'Hoàn thành bài học 🏆';
            } else {
                btnNextText.textContent = 'Tiếp theo';
            }
        }

        window.onload = function () {
            renderApp();
        };
    </script>
