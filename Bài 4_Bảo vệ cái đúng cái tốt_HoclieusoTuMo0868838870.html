<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Bài 4 - Bảo vệ cái đúng, cái tốt</title><style>
:root{--teal:#087e9d;--blue:#207eb3;--orange:#ff9719;--green:#2d9c62;--ink:#183b4b}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#e8f4f7;color:var(--ink);font-family:'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;font-weight:700}.app{min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(150deg,#f7fdff,#eaf7ff)}.top{background:white;padding:10px 2.2vw;display:flex;align-items:center;gap:18px;box-shadow:0 3px 14px #16475e1a}.brand{font-size:clamp(16px,1.55vw,27px);font-weight:900;color:var(--teal)}.progress{flex:1;height:12px;background:#dceff0;border-radius:30px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#44bdb4,#f4ba3f);transition:width .3s}.count{font-size:clamp(15px,1.35vw,24px)}.iconbtn{border:0;background:#eaf5f8;color:#17516b;border-radius:12px;padding:9px 13px;cursor:pointer;font-size:clamp(16px,1.4vw,25px)}.stages{display:flex;gap:10px;padding:9px 2vw 0;justify-content:center}.stage{border:2px solid #d3e5ed;background:white;color:#718d9a;padding:10px 25px;border-radius:100px;font-weight:900;font-size:clamp(13px,1.3vw,22px);cursor:pointer}.stage.on{background:#087e9d;color:white;border-color:#087e9d}.stage.done{border-color:#48b48a;color:#167653}.workspace{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:1.3vh 3vw}.panel{width:100%;max-width:1660px;min-height:65vh;max-height:76vh;background:white;box-shadow:0 16px 50px #22618018;border-radius:34px;padding:clamp(18px,2.6vw,48px);display:flex;flex-direction:column;overflow:auto}.eyebrow{font-size:clamp(16px,1.45vw,26px);color:#e1850f;margin:0 0 5px}.title{font-size:clamp(31px,3.1vw,59px);line-height:1.16;color:#087e9d;margin:0 0 clamp(12px,2vh,26px);font-weight:900}.prompt{font-size:clamp(24px,2.22vw,43px);line-height:1.38;margin:0;color:#243f4b}.content{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}.imageSplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:3.5vw;align-items:center;flex:1}.picture{display:flex;justify-content:center;align-items:center;min-height:0;max-height:48vh}.picture img{max-width:100%;max-height:48vh;object-fit:contain;border-radius:24px;border:3px solid #edf5f4}.qbox{display:flex;flex-direction:column;gap:18px}.options{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.option{font-family:inherit;text-align:left;border:3px solid #d6edf3;background:#f5fbfc;border-radius:22px;padding:clamp(13px,1.5vw,27px);font-size:clamp(20px,1.75vw,32px);font-weight:800;line-height:1.34;cursor:pointer;color:#254455}.option:hover{border-color:#55b0cc}.option.chosen{border-color:#1c8fb3;background:#e1f3fc}.option.good{border-color:#28a769;background:#e1f9e8}.option.bad{border-color:#e85a60;background:#ffe9ea}.feedback{margin-top:18px;border-radius:16px;padding:16px 20px;font-size:clamp(19px,1.7vw,31px);background:#e6f7ed;color:#136c3d}.feedback.no{background:#fff0e6;color:#9b481c}.hint{margin-top:16px;padding:16px 22px;background:#fff6de;border-left:8px solid #ffb544;border-radius:13px;font-size:clamp(20px,1.85vw,34px);line-height:1.36}.hintBtn{align-self:flex-start;margin-top:22px;color:#80550d;background:#ffedbf;border:0;padding:12px 25px;border-radius:30px;font-size:clamp(18px,1.5vw,26px);font-family:inherit;font-weight:900;cursor:pointer}.points{display:grid;gap:15px;margin:25px 0 0;padding:0;list-style:none}.points li{font-size:clamp(23px,2vw,40px);border-radius:15px;background:#eaf8f3;padding:15px 23px}.points li:before{content:'✓ ';color:var(--green)}.story{font-size:clamp(22px,2vw,38px);line-height:1.48;font-weight:700}.question{margin-top:20px;color:#087e9d;font-size:clamp(24px,2vw,40px)}textarea{font-family:inherit;font-size:clamp(21px,1.8vw,32px);width:100%;min-height:120px;max-height:28vh;resize:vertical;border:3px solid #d4e9ef;border-radius:18px;padding:17px;margin-top:22px}.center{text-align:center;align-items:center}.center .content{align-items:center}.huge{font-size:clamp(42px,5vw,95px);color:var(--teal)}.bigEmoji{font-size:clamp(60px,8vw,135px)}.footer{display:flex;align-items:center;justify-content:space-between;padding:12px 3vw 16px;gap:15px}.nav{background:#f7a11b;color:white;border:none;border-radius:20px;padding:clamp(12px,1.3vw,22px) clamp(24px,3vw,55px);font:900 clamp(20px,1.8vw,32px) inherit;cursor:pointer;box-shadow:0 5px 0 #d5810d}.nav.prev{background:#ecf8fc;color:#2b7391;box-shadow:none}.nav:disabled{opacity:.35;cursor:default}.footerNote{color:#527e88;font-size:clamp(15px,1.3vw,24px);text-align:center}.minitags{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:28px 0}.tag{background:#e2f7ed;border-radius:30px;padding:14px 20px;font-size:clamp(18px,1.7vw,31px);color:#22815d}@media(max-width:850px){.stages{flex-wrap:wrap}.stage{padding:8px 12px}.panel{max-height:none;min-height:62vh}.imageSplit{grid-template-columns:1fr;gap:12px}.picture{max-height:27vh}.picture img{max-height:27vh}.options{grid-template-columns:1fr}.workspace{align-items:stretch}.prompt{font-size:clamp(20px,3vw,30px)}.title{font-size:clamp(25px,4vw,40px)}}@media(max-height:700px){.panel{min-height:60vh;max-height:76vh}.top{padding:6px 2vw}.stage{padding:6px 14px}.workspace{padding:1vh 3vw}.panel{padding:1.8vw}.footer{padding:5px 3vw}}

/* Typography optimized for Vietnamese primary pupils and TV projection */
body,button,textarea{font-family:'Arial Rounded MT Bold','Trebuchet MS','Verdana','Arial',sans-serif!important;font-weight:800;letter-spacing:.005em}
.panel{max-height:80vh;min-height:67vh;padding:clamp(16px,2.05vw,39px)}
.title{font-size:clamp(34px,3.5vw,66px);line-height:1.2}
.prompt{font-size:clamp(27px,2.55vw,49px);line-height:1.4}
.option{font-size:clamp(23px,2.02vw,38px);line-height:1.38;padding:clamp(14px,1.5vw,25px);font-weight:900}
.options{gap:13px;margin-top:20px}
.story{font-size:clamp(25px,2.27vw,43px);line-height:1.45}
.question{font-size:clamp(27px,2.33vw,45px)}
.points li{font-size:clamp(26px,2.25vw,44px);line-height:1.35;padding:12px 20px}
.hint{font-size:clamp(23px,2.12vw,40px)}
.feedback{font-size:clamp(22px,1.94vw,37px)}
.hintBtn{font-size:clamp(21px,1.72vw,31px)}
textarea{font-size:clamp(24px,2.05vw,38px)}
.stage{font-size:clamp(16px,1.48vw,27px);padding:9px 21px}
.brand{font-size:clamp(18px,1.7vw,30px)}
.count{font-size:clamp(18px,1.5vw,28px)}
.nav{font-family:inherit;font-size:clamp(22px,2vw,37px);font-weight:900}
.footerNote{font-size:clamp(16px,1.42vw,26px)}
.tag{font-size:clamp(21px,1.92vw,36px)}
.eyebrow{font-size:clamp(18px,1.6vw,29px)}
@media(max-width:850px){.title{font-size:clamp(28px,4.4vw,46px)}.prompt{font-size:clamp(23px,3.4vw,37px)}.option{font-size:clamp(21px,3vw,33px)}.stage{padding:7px 11px}}
@media(max-height:700px){.panel{max-height:78vh;padding:clamp(12px,1.7vw,30px)}.options{margin-top:11px;gap:9px}.option{padding:10px 14px}.title{margin-bottom:9px}}

const slides=[{"stage": 0, "type": "cover", "title": "BẢO VỆ CÁI ĐÚNG, CÁI TỐT", "subtitle": "Đạo đức • Bài 4", "prompt": "Cùng học cách nhận ra, ủng hộ và mạnh dạn bảo vệ những việc làm đúng, việc làm tốt!"}, {"stage": 0, "type": "talk", "title": "Khởi động: Em đã thấy việc tốt nào?", "prompt": "Em hãy kể một việc làm đúng, tốt của bạn trong lớp hoặc trong trường mà em đã chứng kiến.", "hint": "Gợi ý: nhặt được của rơi trả lại người mất; giúp bạn học; giữ vệ sinh; giúp đỡ người gặp khó khăn."}, {"stage": 0, "type": "choice", "title": "Em sẽ làm gì khi thấy việc tốt?", "prompt": "Bạn nhặt được tiền và nộp cho cô giáo. Em sẽ ứng xử thế nào?", "options": ["Khen bạn và học theo việc làm của bạn.", "Im lặng vì việc đó không liên quan đến mình.", "Chỉ khen nếu người nhặt được tiền là bạn thân.", "Khuyên bạn lần sau đừng mất thời gian tìm người đánh rơi."], "correct": 0, "explain": "Khen ngợi và học tập việc tốt là cách thiết thực để ủng hộ cái đúng, cái tốt."}, {"stage": 1, "type": "section", "title": "KHÁM PHÁ", "prompt": "Quan sát từng bức tranh, suy nghĩ và cùng thảo luận."}, {"stage": 1, "type": "picture", "title": "Tranh 1: Không cho bạn chép bài", "image": "copy", "prompt": "Bạn nữ từ chối cho chép bài và khuyên bạn cố gắng tự làm. Theo em, ai đang làm đúng?", "hint": "Không tiếp tay cho việc gian lận; động viên bạn tự học."}, {"stage": 1, "type": "picture", "title": "Tranh 2: Đội mũ bảo hiểm", "image": "helmet", "prompt": "Bạn nữ nhắc bạn đội mũ bảo hiểm khi ngồi trên xe máy. Việc làm nào cần bảo vệ?", "hint": "Nhắc nhở mọi người chấp hành quy tắc an toàn giao thông."}, {"stage": 1, "type": "picture", "title": "Tranh 3: Giúp người cao tuổi", "image": "elder", "prompt": "Có bạn muốn đi học ngay, có bạn muốn chờ người đang giúp cụ già. Em ủng hộ ai? Vì sao?", "hint": "Nên ủng hộ người đang giúp đỡ cụ già; biết sắp xếp thời gian phù hợp."}, {"stage": 1, "type": "picture", "title": "Tranh 4: Tự làm việc của mình", "image": "dishes", "prompt": "Hai anh em trao đổi việc dọn bát sau khi ăn. Ai có ý thức trách nhiệm?", "hint": "Tự giác làm việc nhà phù hợp, không ỷ lại người khác."}, {"stage": 1, "type": "reveal", "title": "Ghi nhớ 1: Cái đúng, cái tốt là gì?", "prompt": "Cái đúng, cái tốt là những lời nói, việc làm phù hợp với đạo đức, quy định, đem lại lợi ích cho bản thân và mọi người.", "points": ["Trung thực, tự giác, có trách nhiệm.", "Biết giúp đỡ, tôn trọng và quan tâm người khác.", "Tuân thủ nội quy và bảo vệ môi trường."]}, {"stage": 1, "type": "story", "title": "Câu chuyện: Bảo vệ như thế là rất tốt (1/3)", "prompt": "Lí Phúc Nha là chiến sĩ mới làm nhiệm vụ bảo vệ tại chiến khu. Một cụ già cao, gầy đi dép cao su rảo bước đến gần vọng gác. Nha lễ phép hỏi: “Chú gác ở đây à?” – “Cụ cho cháu xem giấy tờ ạ!”", "question": "Theo em, tại sao Nha đề nghị cụ già xuất trình giấy tờ?", "hint": "Vì ai muốn vào nơi cần bảo vệ cũng phải tuân thủ quy định."}, {"stage": 1, "type": "story", "title": "Câu chuyện: Bảo vệ như thế là rất tốt (2/3)", "prompt": "Cụ vui vẻ đáp: “Bác đây mà.” Nha vẫn nghiêm túc: “Bác cũng phải có giấy! Có giấy mới được vào ạ!” Đại đội trưởng chạy tới, lo lắng: “Bác Hồ đây mà. Sao đồng chí không để Bác vào nhà của Bác?”", "question": "Nha có nên bỏ qua quy định khi biết người đến là Bác Hồ không?", "hint": "Giữ đúng nguyên tắc, không phân biệt đối xử."}, {"stage": 1, "type": "story", "title": "Câu chuyện: Bảo vệ như thế là rất tốt (3/3)", "prompt": "Bác Hồ ân cần nói: “Chú ấy làm nhiệm vụ bảo vệ như thế là rất tốt.”", "question": "Lời nói của Bác Hồ cho thấy điều gì?", "hint": "Bác tôn trọng quy định, khen ngợi người dám làm đúng nhiệm vụ."}, {"stage": 1, "type": "picture", "title": "Đứng về phía sự thật", "image": "bully", "prompt": "Một bạn nói cô giáo thiên vị, nhưng các bạn khác biết đó là thông tin sai. Nên làm gì?", "hint": "Bình tĩnh tìm hiểu, lên tiếng bảo vệ sự thật; không lan truyền lời vu khống."}, {"stage": 1, "type": "picture", "title": "Ngăn bạn làm điều sai", "image": "cheat", "prompt": "Một bạn nhắc bạn khác: “Bạn đừng làm thế!” khi bạn định xem bài. Em nhận xét thế nào?", "hint": "Khuyên bạn không gian lận trong học tập."}, {"stage": 1, "type": "picture", "title": "Bảo vệ bạn yếu thế", "image": "fight", "prompt": "Có bạn bị bắt nạt và người khác can ngăn. Em nên làm gì để an toàn?", "hint": "Không tham gia đánh nhau; tìm người lớn hỗ trợ và bảo vệ bạn."}, {"stage": 1, "type": "picture", "title": "Cùng làm việc tốt", "image": "garden", "prompt": "Hai bạn cùng chăm sóc cây xanh ở trường. Vì sao hành động này đáng ủng hộ?", "hint": "Ủng hộ bằng hành động cùng tham gia, không chỉ bằng lời nói."}, {"stage": 1, "type": "reveal", "title": "Ghi nhớ 2: Bảo vệ cái đúng, cái tốt", "prompt": "Bảo vệ cái đúng, cái tốt giúp cuộc sống an toàn, công bằng và lành mạnh hơn.", "points": ["Nhận ra và nói lời ủng hộ.", "Làm theo, lan tỏa những việc tốt.", "Góp ý lịch sự khi thấy việc sai; nhờ người lớn hỗ trợ khi cần."]}, {"stage": 2, "type": "section", "title": "LUYỆN TẬP", "prompt": "Mỗi lần một câu hỏi. Chọn đáp án rồi nghe phản hồi để hiểu rõ vì sao."}, {"stage": 2, "type": "choice", "title": "Ý kiến A", "prompt": "“Bảo vệ cái đúng, cái tốt là những việc làm có ích cho người khác và xã hội.”", "options": ["Tán thành, vì việc đó mang lại lợi ích chung.", "Không tán thành, vì chỉ người lớn mới cần bảo vệ điều đúng.", "Chỉ tán thành nếu việc tốt đem lại phần thưởng."], "correct": 0, "explain": "Bảo vệ cái đúng, cái tốt có ích cho cộng đồng; học sinh cũng góp phần thực hiện được."}, {"stage": 2, "type": "choice", "title": "Ý kiến B", "prompt": "“Trẻ em chưa đủ khả năng để bảo vệ cái đúng, cái tốt.”", "options": ["Tán thành vì trẻ em luôn cần đứng ngoài.", "Không tán thành vì trẻ em có thể góp sức bằng cách phù hợp và an toàn.", "Tán thành khi vụ việc xảy ra ngoài trường."], "correct": 1, "explain": "Trẻ em có thể lên tiếng, động viên, làm gương và báo người lớn khi cần."}, {"stage": 2, "type": "choice", "title": "Ý kiến C", "prompt": "“Cần ủng hộ, đồng tình với những người thực hiện cái đúng, cái tốt.”", "options": ["Chỉ nên ủng hộ những người mình quen.", "Không nên ủng hộ vì dễ mất thời gian.", "Tán thành vì sự ủng hộ khích lệ việc tốt lan rộng."], "correct": 2, "explain": "Đồng tình, khuyến khích và noi theo giúp nhân rộng điều tốt."}, {"stage": 2, "type": "choice", "title": "Ý kiến D", "prompt": "“Không cần quan tâm đến cái đúng, cái tốt nếu điều đó không liên quan đến mình.”", "options": ["Không tán thành vì mọi người đều có trách nhiệm với cộng đồng.", "Tán thành nếu không có lợi ích trực tiếp.", "Tán thành vì tốt nhất không bao giờ lên tiếng."], "correct": 0, "explain": "Sự thờ ơ có thể khiến cái sai tiếp diễn và người làm đúng bị cô lập."}, {"stage": 2, "type": "choice", "title": "Ý kiến E", "prompt": "“Nếu không bảo vệ cái đúng, cái tốt thì cái sai, cái xấu có thể lấn át.”", "options": ["Không tán thành vì cái đúng luôn tự thắng.", "Tán thành vì im lặng có thể khiến hành vi sai kéo dài.", "Chỉ tán thành khi sai phạm xảy ra ở trường."], "correct": 1, "explain": "Cần lên tiếng phù hợp để cái tốt được ghi nhận và cái sai được sửa chữa."}, {"stage": 2, "type": "choice", "title": "Ý kiến G", "prompt": "“Bảo vệ cái đúng, cái tốt giúp cuộc sống an toàn, lành mạnh.”", "options": ["Chỉ đúng đối với người lớn.", "Chỉ đúng khi hành động được nhiều người khen.", "Tán thành vì hành vi tốt tạo môi trường sống tích cực."], "correct": 2, "explain": "Đó là lợi ích quan trọng của việc bảo vệ cái đúng, cái tốt."}, {"stage": 2, "type": "choice", "title": "Lựa chọn cách ứng xử 1", "prompt": "Em thấy bạn làm một việc tốt nhưng bị người khác chê cười. Em nên làm gì?", "options": ["Im lặng vì sợ bị trêu theo.", "Ủng hộ bạn, giải thích lịch sự vì sao đó là việc tốt.", "Chỉ ủng hộ khi cô giáo có mặt."], "correct": 1, "explain": "Sự ủng hộ đúng lúc giúp bạn thêm tự tin làm điều tốt."}, {"stage": 2, "type": "choice", "title": "Lựa chọn cách ứng xử 2", "prompt": "Bạn thân có hành vi chưa đúng. Em nên làm gì?", "options": ["Bênh bạn trong mọi hoàn cảnh để giữ tình bạn.", "Kể khắp lớp để bạn xấu hổ và thay đổi.", "Góp ý riêng, chân thành và giúp bạn sửa sai."], "correct": 2, "explain": "Bảo vệ cái đúng không đồng nghĩa với chê bai hoặc bao che cho cái sai."}, {"stage": 2, "type": "choice", "title": "Lựa chọn cách ứng xử 3", "prompt": "Một bạn luôn nhặt rác và giúp lớp sạch đẹp. Em sẽ làm gì?", "options": ["Cùng bạn giữ vệ sinh và khuyến khích mọi người tham gia.", "Chỉ khen bằng lời, tuyệt đối không cần hành động.", "Chờ cô giáo giao việc mới tham gia."], "correct": 0, "explain": "Noi gương và cùng thực hiện là cách bảo vệ việc tốt hiệu quả."}, {"stage": 2, "type": "picture", "title": "Tình huống 1: Bảo vệ môi trường", "image": "litter", "prompt": "Lan giữ vỏ bánh kẹo đến nơi có thùng rác, Bình chê Lan. Em ủng hộ ai? Vì sao?", "hint": "Lan làm đúng vì không xả rác bừa bãi; em nên giải thích và làm theo Lan."}, {"stage": 2, "type": "picture", "title": "Tình huống 2: Bảo vệ bạn lớp trưởng", "image": "leader", "prompt": "Hoa nhắc bạn giữ trật tự và bị một số bạn trêu chọc. Nếu là bạn của Hoa, em làm gì?", "hint": "Khuyên các bạn tôn trọng nội quy, động viên Hoa; nhờ cô giáo hỗ trợ khi cần."}, {"stage": 2, "type": "picture", "title": "Tình huống 3: Nhờ người lớn giúp đỡ", "image": "guard", "prompt": "Thắng thấy người có biểu hiện đáng ngờ và báo chú bảo vệ. Em nhận xét hành động của Thắng.", "hint": "Biết tìm người lớn có trách nhiệm hỗ trợ, không tự đối đầu với người lạ."}, {"stage": 2, "type": "picture", "title": "Tình huống 4: Không gây nguy hiểm", "image": "branch", "prompt": "Huy kéo cành cây ra đường, Hòa khuyên dừng lại nhưng Thức vẫn tham gia. Em sẽ nói gì?", "hint": "Nhắc các bạn dừng ngay và cùng dọn cây an toàn với sự hỗ trợ của người lớn."}, {"stage": 2, "type": "talk", "title": "Em xử lí thế nào? – Hàng rào", "prompt": "Dũng và Phong thấy vài bạn chui qua lỗ hổng hàng rào để hái ổi. Phong muốn bỏ đi. Nếu ở đó, em sẽ làm gì?", "hint": "Nhắc các bạn không tự ý vào vườn người khác; nếu cần, báo người lớn. Không tự gây xung đột."}, {"stage": 2, "type": "talk", "title": "Em xử lí thế nào? – Nhặt rác tái chế", "prompt": "Nhung nhặt chai nhựa, hộp giấy để tái chế và bị chế giễu là “Nhung nhặt rác”. Em sẽ làm gì?", "hint": "Động viên, ủng hộ Nhung; giải thích lợi ích của tái chế và cùng tham gia."}, {"stage": 2, "type": "talk", "title": "Em xử lí thế nào? – Trả lại tiền", "prompt": "Hà nhặt được tiền của bà bán hàng và trả lại, Nga trách vì mất cơ hội mua kem. Em sẽ nói gì?", "hint": "Khen Hà trung thực, giải thích vì sao phải trả lại tiền cho người đánh rơi."}, {"stage": 3, "type": "section", "title": "VẬN DỤNG", "prompt": "Biến điều em học thành những hành động đẹp trong cuộc sống!"}, {"stage": 3, "type": "talk", "title": "Việc tốt em sẽ làm hôm nay", "prompt": "Hãy nói hoặc viết một việc em sẽ làm để bảo vệ cái đúng, cái tốt ngay hôm nay.", "hint": "Ví dụ: Em sẽ lên tiếng lịch sự khi thấy bạn bị trêu chọc và báo cô giáo nếu có nguy cơ mất an toàn."}, {"stage": 3, "type": "talk", "title": "Tấm gương em muốn giới thiệu", "prompt": "Hãy giới thiệu một người em biết luôn bảo vệ cái đúng, cái tốt. Em học được điều gì ở người đó?", "hint": "Người đó có thể là bạn, thầy cô, người thân hoặc một nhân vật trong câu chuyện em đọc."}, {"stage": 3, "type": "reveal", "title": "Thông điệp em mang theo", "prompt": "Học hành, rèn luyện, vui chung – Bảo vệ cái đúng ta cùng tham gia!", "points": ["Nhận ra việc đúng, việc tốt.", "Dũng cảm ủng hộ bằng cách phù hợp.", "Lịch sự, an toàn, sẵn sàng nhờ người lớn giúp đỡ."]}, {"stage": 3, "type": "finish", "title": "HOÀN THÀNH BÀI HỌC", "prompt": "Em đã sẵn sàng nhận ra, ủng hộ và bảo vệ cái đúng, cái tốt!"}];const images={"copy": "data:image/webp;base64,UklGRu4wAABXRUJQVlA4IOIwAABQzwCdASplATsBPm00lUekIyIhJlIrUIANiWNu/CAoA55zrvAgL7PGRfXH8v/LenpyH3FfA/tPrp3t30fP/nT/3v7Oe8H+r/7T2C/2I89r9gPen+8Pqb/bj1ef+163/696g39Z/2HXFegp+4fp0+0n/Zv+96Xeqd+kf8x3A/5L8tPQ38Z+k/xH5df2r26/7bxydZ/9L0N/kX3a/R/3n90/7x76/9Txd+Tv+J9vnyEfj/9I/0X9y/Ir1Xdstbf/pf5X2Ava37P/u/8D+7X+g9S function sound(good=true){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const ns=good?[523,659,784]:[290,235];ns.forEach((freq,j)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type=good?'sine':'triangle';osc.frequency.setValueAtTime(freq,now+j*.12);gain.gain.setValueAtTime(.0001,now+j*.12);gain.gain.exponentialRampToValueAtTime(.12,now+j*.12+.018);gain.gain.exponentialRampToValueAtTime(.0001,now+j*.12+.17);osc.connect(gain).connect(audio.destination);osc.start(now+j*.12);osc.stop(now+j*.12+.19)})}catch(e){}}
function escapeHtml(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function go(n){if(n<0||n>=slides.length)return;if(n!==index)sound();index=n;render();}
function hint(){hints[index]=!hints[index];render();}function answer(n){answers[index]=n;sound(n===slides[index].correct);render();}
function render(){const s=slides[index];$('bar').style.width=((index+1)/slides.length*100)+'%';$('count').textContent=`${index+1} / ${slides.length}`;$('stages').innerHTML=names.map((n,j)=>`<button class="stage ${j===s.stage?'on':j<s.stage?'done':''}" data-stage="${j}">${['🚀','🔎','💪','🌱'][j]} ${n}</button>`).join('');document.querySelectorAll('[data-stage]').forEach(e=>e.onclick=()=>go(slides.findIndex(x=>x.stage===+e.dataset.stage)));$('prev').disabled=index===0;$('next').textContent=index===slides.length-1?'Học lại ↻':'Tiếp theo ❯';$('next').onclick=()=>{if(index===slides.length-1){index=0;answers={};hints={};notes={};render();}else go(index+1)};
let body='';const q=escapeHtml(s.prompt||'');
if(s.type==='cover')body=`<div class="content center"><div class="bigEmoji">🛡️🌼</div><h2 class="huge">BẢO VỆ CÁI ĐÚNG,<br>CÁI TỐT</h2><p class="prompt">${q}</p><div class="minitags"><span class="tag">Nhận biết</span><span class="tag">Ủng hộ</span><span class="tag">Hành động</span></div></div>`;
else if(s.type==='section')body=`<div class="content center"><div class="bigEmoji">${['🚀','🔎','💪','🌱'][s.stage]}</div><h2 class="huge">${escapeHtml(s.title)}</h2><p class="prompt">${q}</p></div>`;
else if(s.type==='finish')body=`<div class="content center"><div class="bigEmoji">🏆🎉✨</div><h2 class="huge">${escapeHtml(s.title)}</h2><p class="prompt">${q}</p><div class="minitags"><span class="tag">Em biết nhận ra</span><span class="tag">Em biết ủng hộ</span><span class="tag">Em biết hành động</span></div></div>`;
else if(s.type==='picture')body=`<h1 class="title">${escapeHtml(s.title)}</h1><div class="imageSplit"><div class="picture"><img src="${images[s.image]}" alt="Tranh minh họa từ sách giáo khoa" /></div><div class="qbox"><p class="prompt">${q}</p><button class="hintBtn" id="hintbtn">💡 ${hints[index]?'Ẩn gợi ý':'Xem gợi ý'}</button>${hints[index]?`<div class="hint">${escapeHtml(s.hint)}</div>`:''}</div></div>`;
else if(s.type==='choice'){const selected=answers[index];body=`<h1 class="title">${escapeHtml(s.title)}</h1><div class="content"><p class="prompt">${q}</p><div class="options">${s.options.map((o,n)=>`<button class="option ${selected===n?'chosen':''} ${selected!==undefined&&n===s.correct?'good':''} ${selected===n&&n!==s.correct?'bad':''}" data-opt="${n}">${String.fromCharCode(65+n)}. ${escapeHtml(o)}</button>`).join('')}</div>${selected===undefined?'':`<div class="feedback ${selected===s.correct?'':'no'}">${selected===s.correct?'✅ Chính xác!':'💡 Chưa chính xác. Em thử suy nghĩ lại nhé.'} ${escapeHtml(s.explain)}</div>`}</div>`;}
else if(s.type==='reveal')body=`<h1 class="title">${escapeHtml(s.title)}</h1><div class="content"><p class="prompt">${q}</p><ul class="points">${s.points.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>`;
else if(s.type==='story')body=`<h1 class="title">${escapeHtml(s.title)}</h1><div class="content"><div class="story">${q}</div><div class="question">❓ ${escapeHtml(s.question)}</div><button class="hintBtn" id="hintbtn">💡 ${hints[index]?'Ẩn gợi ý':'Xem gợi ý'}</button>${hints[index]?`<div class="hint">${escapeHtml(s.hint)}</div>`:''}</div>`;
else if(s.type==='talk')body=`<h1 class="title">${escapeHtml(s.title)}</h1><div class="content"><p class="prompt">${q}</p><textarea id="response" placeholder="Em có thể ghi ý kiến tại đây hoặc phát biểu trước lớp..."></textarea><button class="hintBtn" id="hintbtn">💡 ${hints[index]?'Ẩn gợi ý':'Xem gợi ý'}</button>${hints[index]?`<div class="hint">${escapeHtml(s.hint)}</div>`:''}</div>`;
$('panel').innerHTML=body;document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answer(+b.dataset.opt));if($('hintbtn'))$('hintbtn').onclick=hint;const resp=$('response');if(resp){resp.value=notes[index]||'';resp.oninput=()=>{notes[index]=resp.value}};$('footerNote').textContent=`${names[s.stage]} • ${index+1}/${slides.length} • Phím ← → để chuyển màn hình`;
}
$('prev').onclick=()=>go(index-1);$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};$('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};window.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key.toLowerCase()==='f')$('full').click()});render();
