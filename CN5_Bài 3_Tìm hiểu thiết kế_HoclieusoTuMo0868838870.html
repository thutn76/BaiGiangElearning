            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);

    <!-- MÃ NGUỒN JAVASCRIPT XỬ LÝ TOÀN BỘ TƯƠNG TÁC BÀI HỌC -->
    <script>
        /**************************************************************
         * 1. HỆ THỐNG ÂM THANH (WEB AUDIO API) & ĐỌC BÀI (SPEECH API)
         **************************************************************/
        let soundEnabled = true;
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioCtx();
                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(550, now);
                    osc.frequency.exponentialRampToValueAtTime(840, now + 0.065);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.07);
                } else if (type === 'pop') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(920, now + 0.1);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.11);
                } else if (type === 'correct') {
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.075);
                        gain.gain.setValueAtTime(0.22, now + idx * 0.075);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.075 + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.075);
                        osc.stop(now + idx * 0.075 + 0.26);
                    });
                } else if (type === 'wrong') {
                    const notes = [300, 235];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.13);
                        gain.gain.setValueAtTime(0.12, now + idx * 0.13);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.13 + 0.2);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.13);
                        osc.stop(now + idx * 0.13 + 0.21);
                    });
                } else if (type === 'fanfare') {
                    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
                    const times = [0, 0.11, 0.22, 0.33, 0.47, 0.62];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + times[idx]);
                        gain.gain.setValueAtTime(0.24, now + times[idx]);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + times[idx] + 0.32);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + times[idx]);
                        osc.stop(now + times[idx] + 0.33);
                    });
                }
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
            if (soundEnabled) playSound('pop');
        }

        function toggleFullScreen() {
            playSound('click');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'vi-VN';
            utter.rate = 0.95;
            utter.pitch = 1.05;
            const ttsBtn = document.getElementById('tts-label');
            utter.onstart = () => { if (ttsBtn) ttsBtn.textContent = 'Đang đọc...'; };
            utter.onend = () => { if (ttsBtn) ttsBtn.textContent = 'Đọc bài'; };
            utter.onerror = () => { if (ttsBtn) ttsBtn.textContent = 'Đọc bài'; };
            window.speechSynthesis.speak(utter);
        }

        function speakCurrentStep() {
            playSound('pop');
            const currentStepObj = STAGES[state.stageIdx].steps[state.stepIdx];
            if (currentStepObj && currentStepObj.voiceText) {
                speakText(currentStepObj.voiceText);
            }
        }

        /**************************************************************
         * 2. HIỆU ỨNG PHÁO HOA CHÚC MỪNG (CONFETTI)
         **************************************************************/
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#eab308'];
            for (let i = 0; i < 90; i++) {
                pieces.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 260,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: -Math.random() * 15 - 5,
                    size: Math.random() * 10 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vrot: (Math.random() - 0.5) * 12
                });
            }

            let frame = 0;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.42;
                    p.rot += p.vrot;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                    ctx.restore();
                });
                frame++;
                if (frame < 95) {
                    requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            render();
        }

        /**************************************************************
         * 5. HÀM THƯỞNG SAO & HIỂN THỊ PHẢN HỒI ĐÚNG / SAI
         **************************************************************/
        function rewardStar(key, points = 1) {
            if (!state.rewardedKeys[key]) {
                state.rewardedKeys[key] = true;
                state.stars += points;
                const el = document.getElementById('star-count');
                const badge = document.getElementById('star-badge');
                if (el) el.textContent = state.stars;
                if (badge) {
                    badge.classList.add('scale-110');
                    setTimeout(() => badge.classList.remove('scale-110'), 280);
                }
            }
        }

        function showFeedback(isCorrect, message) {
            const banner = document.getElementById('feedback-banner');
            banner.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-300', 'text-emerald-900', 'bg-rose-50', 'border-rose-300', 'text-rose-900');
            banner.classList.add('flex');
            if (isCorrect) {
                banner.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
                banner.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-black text-lg shrink-0">✓</span>
                        <span class="font-extrabold text-sm sm:text-base">${message}</span>
                    </div>
                    <span class="text-xs sm:text-sm font-black bg-amber-200 text-amber-900 px-3 py-1 rounded-full shrink-0">+1 Sao ⭐</span>
                `;
            } else {
                banner.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-900');
                banner.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center font-black text-lg shrink-0">!</span>
                        <span class="font-extrabold text-sm sm:text-base">${message}</span>
                    </div>
                `;
            }
        }

        function hideFeedback() {
            const banner = document.getElementById('feedback-banner');
            banner.classList.add('hidden');
            banner.classList.remove('flex');
        }

        function saveCurrentCanvasSnapshot() {
            const canvas = document.getElementById('sketch-canvas');
            if (canvas) {
                state.savedCanvasDataUrl = canvas.toDataURL('image/png');
            }
        }

        function initSketchCanvas() {
            const canvas = document.getElementById('sketch-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (state.savedCanvasDataUrl) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                };
                img.src = state.savedCanvasDataUrl;
            } else {
                drawGuideShape(ctx, state.sketchTemplate);
                state.savedCanvasDataUrl = canvas.toDataURL('image/png');
            }

            let drawing = false;
            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (canvas.width / rect.width),
                    y: (clientY - rect.top) * (canvas.height / rect.height)
                };
            }

            canvas.onmousedown = (e) => {
                drawing = true;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };
            canvas.onmousemove = (e) => {
                if (!drawing) return;
                const pos = getPos(e);
                ctx.strokeStyle = state.brushColor;
                ctx.lineWidth = state.brushSize;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };
            window.onmouseup = () => {
                if (drawing) {
                    drawing = false;
                    saveCurrentCanvasSnapshot();
                    rewardStar('draw_canvas', 1);
                }
            };

            canvas.ontouchstart = (e) => {
                e.preventDefault();
                drawing = true;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };
            canvas.ontouchmove = (e) => {
                e.preventDefault();
                if (!drawing) return;
                const pos = getPos(e);
                ctx.strokeStyle = state.brushColor;
                ctx.lineWidth = state.brushSize;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };
            canvas.ontouchend = () => {
                drawing = false;
                saveCurrentCanvasSnapshot();
                rewardStar('draw_canvas', 1);
            };
        }

        function drawGuideShape(ctx, tpl) {
            ctx.save();
            ctx.strokeStyle = '#94a3b8';
            ctx.setLineDash([5, 4]);
            ctx.lineWidth = 2.2;
            if (tpl === 'pencilcase') {
                ctx.strokeRect(140, 50, 280, 95);
                ctx.beginPath();
                ctx.moveTo(140, 72);
                ctx.lineTo(420, 72);
                ctx.stroke();
                ctx.font = 'bold 20px Nunito, sans-serif';
                ctx.fillStyle = '#cbd5e1';
                ctx.fillText('☆   ☆   ☆', 235, 115);
            } else if (tpl === 'pinwheel') {
                ctx.beginPath();
                ctx.moveTo(280, 90);
                ctx.lineTo(280, 185);
                ctx.stroke();
                const pts = [[220, 30], [340, 30], [340, 140], [220, 140]];
                pts.forEach(([x, y]) => {
                    ctx.beginPath();
                    ctx.moveTo(280, 90);
                    ctx.lineTo(x, y);
                    ctx.lineTo(280 + (x - 280) * 0.3, y + (90 - y) * 0.5);
                    ctx.closePath();
                    ctx.stroke();
                });
            } else if (tpl === 'vase') {
                ctx.strokeRect(220, 70, 120, 110);
                for (let x = 240; x < 340; x += 20) {
                    ctx.beginPath();
                    ctx.moveTo(x, 70);
                    ctx.lineTo(x, 180);
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.arc(260, 42, 15, 0, Math.PI * 2);
                ctx.arc(300, 42, 15, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawTemplateOnCanvas(tpl) {
            playSound('pop');
            state.sketchTemplate = tpl;
            const canvas = document.getElementById('sketch-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGuideShape(ctx, tpl);
            saveCurrentCanvasSnapshot();
        }

            const ctx = canvas.getContext('2d');

                                <ol class="text-xs sm:text-sm font-extrabold text-slate-900 space-y-1.5 mt-2 list-decimal list-inside">
                                    <li>Hình thành ý tưởng về sản phẩm</li>
                                    <li>Vẽ phác thảo sản phẩm và lựa chọn vật liệu, dụng cụ</li>
                                    <li>Làm sản phẩm mẫu</li>
                                    <li>Đánh giá và hoàn thiện sản phẩm</li>
                                </ol>
                            </div>
                            <div class="bg-emerald-100 border border-emerald-300 rounded-2xl p-2.5 text-xs font-black text-emerald-900 text-center mt-2">
                                ✓ Em đã nắm vững toàn bộ Bài 3: Tìm hiểu thiết kế!
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function celebrateFinishLesson() {
            playSound('fanfare');
            launchConfetti();
            showFeedback(true, 'Chúc mừng Nhà Thiết Kế Nhí Tài Ba đã hoàn thành xuất sắc Bài 3!');
        }

        /**************************************************************
         * 10. ĐIỀU HƯỚNG CHẶNG & BƯỚC (STAGE & STEP NAVIGATION)
         **************************************************************/
        function goToStage(sIdx, stIdx = 0) {
            if (state.stageIdx === 3 && state.stepIdx === 1) {
                saveCurrentCanvasSnapshot();
            }
            playSound('click');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            state.stageIdx = sIdx;
            state.stepIdx = stIdx;
            hideFeedback();
            renderApp();
        }

        function prevStep() {
            if (state.stageIdx === 3 && state.stepIdx === 1) {
                saveCurrentCanvasSnapshot();
            }
            playSound('click');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            hideFeedback();
            if (state.stepIdx > 0) {
                state.stepIdx--;
            } else if (state.stageIdx > 0) {
                state.stageIdx--;
                state.stepIdx = STAGES[state.stageIdx].steps.length - 1;
            }
            renderApp();
        }

        function nextStep() {
            if (state.stageIdx === 3 && state.stepIdx === 1) {
                saveCurrentCanvasSnapshot();
            }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            hideFeedback();
            const currentStage = STAGES[state.stageIdx];
            if (state.stepIdx < currentStage.steps.length - 1) {
                playSound('click');
                state.stepIdx++;
                renderApp();
            } else if (state.stageIdx < STAGES.length - 1) {
                playSound('fanfare');
                launchConfetti();
                state.stageIdx++;
                state.stepIdx = 0;
                renderApp();
            } else {
                celebrateFinishLesson();
            }
        }

        function renderApp() {
            const currentStage = STAGES[state.stageIdx];
            const currentStep = currentStage.steps[state.stepIdx];

            // 1. Render 4 nút chuyển chặng trên Header & Mobile
            const tabsHtml = STAGES.map((st, idx) => {
                const isActive = idx === state.stageIdx;
                return `
                    <button onclick="goToStage(${idx}, 0)"
                        class="px-3.5 py-1.5 rounded-xl font-black text-sm sm:text-base transition-all flex items-center gap-1.5 ${
                            isActive
                                ? `bg-gradient-to-r ${st.color} text-white shadow`
                                : 'text-slate-600 hover:bg-white'
                        }">
                        <span>${st.title}</span>
                    </button>
                `;
            }).join('');
            document.getElementById('stage-tabs').innerHTML = tabsHtml;
            document.getElementById('stage-tabs-mobile').innerHTML = tabsHtml;

            // 2. Render Tiêu đề bước hiện tại
            document.getElementById('step-header').innerHTML = `
                <div class="flex flex-col">
                    <div class="flex items-center gap-2">
                        <span class="px-2.5 py-0.5 rounded-lg text-xs font-black uppercase border ${currentStage.badgeBg}">
                            ${currentStage.title} • Bước ${state.stepIdx + 1}/${currentStage.steps.length}
                        </span>
                    </div>
                    <h2 class="text-lg sm:text-2xl font-black text-slate-900 mt-0.5 leading-tight">
                        ${currentStep.title}
                    </h2>
                    <p class="text-xs sm:text-base font-bold text-slate-600">
                        ${currentStep.subtitle}
                    </p>
                </div>
            `;

            // 3. Render Nội dung bước hiện tại
            const bodyEl = document.getElementById('step-body');
            currentStep.render(bodyEl);

            // 4. Render Thanh chấm tiến trình dưới cùng
            const dotsHtml = currentStage.steps.map((_, idx) => {
                const active = idx === state.stepIdx;
                return `
                    <button onclick="goToStage(${state.stageIdx}, ${idx})"
                        title="Bước ${idx + 1}"
                        class="h-3.5 rounded-full transition-all ${
                            active ? 'w-9 bg-sky-600' : 'w-3.5 bg-slate-300 hover:bg-slate-400'
                        }"></button>
                `;
            }).join('');
            document.getElementById('step-dots').innerHTML = dotsHtml;
            document.getElementById('step-counter-text').textContent =
                `${currentStage.title} — Bước ${state.stepIdx + 1} / ${currentStage.steps.length}`;

            // 5. Cập nhật trạng thái nút Quay lại & Tiếp theo
            const btnPrev = document.getElementById('btn-prev');
            btnPrev.disabled = (state.stageIdx === 0 && state.stepIdx === 0);

            const btnNextText = document.getElementById('btn-next-text');
            const isLastStepOfStage = state.stepIdx === currentStage.steps.length - 1;
            const isLastStage = state.stageIdx === STAGES.length - 1;

            if (isLastStepOfStage && !isLastStage) {
                btnNextText.textContent = `Sang ${STAGES[state.stageIdx + 1].title} 🎉`;
            } else if (isLastStepOfStage && isLastStage) {
                btnNextText.textContent = 'Hoàn thành bài học 🏆';
            } else {
                btnNextText.textContent = 'Tiếp theo';
            }
        }

        window.onload = function () {
            renderApp();
        };
    </script>
</body>
</html>
