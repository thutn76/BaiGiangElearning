<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Bài 4 - Bảo vệ cái đúng, cái tốt</title><style>
:root{--teal:#087e9d;--blue:#207eb3;--orange:#ff9719;--green:#2d9c62;--ink:#183b4b}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#e8f4f7;color:var(--ink);font-family:'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;font-weight:700}.app{min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(150deg,#f7fdff,#eaf7ff)}.top{background:white;padding:10px 2.2vw;display:flex;align-items:center;gap:18px;box-shadow:0 3px 14px #16475e1a}.brand{font-size:clamp(16px,1.55vw,27px);font-weight:900;color:var(--teal)}.progress{flex:1;height:12px;background:#dceff0;border-radius:30px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#44bdb4,#f4ba3f);transition:width .3s}.count{font-size:clamp(15px,1.35vw,24px)}.iconbtn{border:0;background:#eaf5f8;color:#17516b;border-radius:12px;padding:9px 13px;cursor:pointer;font-size:clamp(16px,1.4vw,25px)}.stages{display:flex;gap:10px;padding:9px 2vw 0;justify-content:center}.stage{border:2px solid #d3e5ed;background:white;color:#718d9a;padding:10px 25px;border-radius:100px;font-weight:900;font-size:clamp(13px,1.3vw,22px);cursor:pointer}.stage.on{background:#087e9d;color:white;border-color:#087e9d}.stage.done{border-color:#48b48a;color:#167653}.workspace{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:1.3vh 3vw}.panel{width:100%;max-width:1660px;min-height:65vh;max-height:76vh;background:white;box-shadow:0 16px 50px #22618018;border-radius:34px;padding:clamp(18px,2.6vw,48px);display:flex;flex-direction:column;overflow:auto}.eyebrow{font-size:clamp(16px,1.45vw,26px);color:#e1850f;margin:0 0 5px}.title{font-size:clamp(31px,3.1vw,59px);line-height:1.16;color:#087e9d;margin:0 0 clamp(12px,2vh,26px);font-weight:900}.prompt{font-size:clamp(24px,2.22vw,43px);line-height:1.38;margin:0;color:#243f4b}.content{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}.imageSplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:3.5vw;align-items:center;flex:1}.picture{display:flex;justify-content:center;align-items:center;min-height:0;max-height:48vh}.picture img{max-width:100%;max-height:48vh;object-fit:contain;border-radius:24px;border:3px solid #edf5f4}.qbox{display:flex;flex-direction:column;gap:18px}.options{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.option{font-family:inherit;text-align:left;border:3px solid #d6edf3;background:#f5fbfc;border-radius:22px;padding:clamp(13px,1.5vw,27px);font-size:clamp(20px,1.75vw,32px);font-weight:800;line-height:1.34;cursor:pointer;color:#254455}.option:hover{border-color:#55b0cc}.option.chosen{border-color:#1c8fb3;background:#e1f3fc}.option.good{border-color:#28a769;background:#e1f9e8}.option.bad{border-color:#e85a60;background:#ffe9ea}.feedback{margin-top:18px;border-radius:16px;padding:16px 20px;font-size:clamp(19px,1.7vw,31px);background:#e6f7ed;color:#136c3d}.feedback.no{background:#fff0e6;color:#9b481c}.hint{margin-top:16px;padding:16px 22px;background:#fff6de;border-left:8px solid #ffb544;border-radius:13px;font-size:clamp(20px,1.85vw,34px);line-height:1.36}.hintBtn{align-self:flex-start;margin-top:22px;color:#80550d;background:#ffedbf;border:0;padding:12px 25px;border-radius:30px;font-size:clamp(18px,1.5vw,26px);font-family:inherit;font-weight:900;cursor:pointer}.points{display:grid;gap:15px;margin:25px 0 0;padding:0;list-style:none}.points li{font-size:clamp(23px,2vw,40px);border-radius:15px;background:#eaf8f3;padding:15px 23px}.points li:before{content:'✓ ';color:var(--green)}.story{font-size:clamp(22px,2vw,38px);line-height:1.48;font-weight:700}.question{margin-top:20px;color:#087e9d;font-size:clamp(24px,2vw,40px)}textarea{font-family:inherit;font-size:clamp(21px,1.8vw,32px);width:100%;min-height:120px;max-height:28vh;resize:vertical;border:3px solid #d4e9ef;border-radius:18px;padding:17px;margin-top:22px}.center{text-align:center;align-items:center}.center .content{align-items:center}.huge{font-size:clamp(42px,5vw,95px);color:var(--teal)}.bigEmoji{font-size:clamp(60px,8vw,135px)}.footer{display:flex;align-items:center;justify-content:space-between;padding:12px 3vw 16px;gap:15px}.nav{background:#f7a11b;color:white;border:none;border-radius:20px;padding:clamp(12px,1.3vw,22px) clamp(24px,3vw,55px);font:900 clamp(20px,1.8vw,32px) inherit;cursor:pointer;box-shadow:0 5px 0 #d5810d}.nav.prev{background:#ecf8fc;color:#2b7391;box-shadow:none}.nav:disabled{opacity:.35;cursor:default}.footerNote{color:#527e88;font-size:clamp(15px,1.3vw,24px);text-align:center}.minitags{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:28px 0}.tag{background:#e2f7ed;border-radius:30px;padding:14px 20px;font-size:clamp(18px,1.7vw,31px);color:#22815d}@media(max-width:850px){.stages{flex-wrap:wrap}.stage{padding:8px 12px}.panel{max-height:none;min-height:62vh}.imageSplit{grid-template-columns:1fr;gap:12px}.picture{max-height:27vh}.picture img{max-height:27vh}.options{grid-template-columns:1fr}.workspace{align-items:stretch}.prompt{font-size:clamp(20px,3vw,30px)}.title{font-size:clamp(25px,4vw,40px)}}@media(max-height:700px){.panel{min-height:60vh;max-height:76vh}.top{padding:6px 2vw}.stage{padding:6px 14px}.workspace{padding:1vh 3vw}.panel{padding:1.8vw}.footer{padding:5px 3vw}}

/* Typography optimized for Vietnamese primary pupils and TV projection */
body,button,textarea{font-family:'Arial Rounded MT Bold','Trebuchet MS','Verdana','Arial',sans-serif!important;font-weight:800;letter-spacing:.005em}
.panel{max-height:80vh;min-height:67vh;padding:clamp(16px,2.05vw,39px)}
.title{font-size:clamp(34px,3.5vw,66px);line-height:1.2}
.prompt{font-size:clamp(27px,2.55vw,49px);line-height:1.4}
.option{font-size:clamp(23px,2.02vw,38px);line-height:1.38;padding:clamp(14px,1.5vw,25px);font-weight:900}
.options{gap:13px;margin-top:20px}
.story{font-size:clamp(25px,2.27vw,43px);line-height:1.45}
.question{font-size:clamp(27px,2.33vw,45px)}
.points li{font-size:clamp(26px,2.25vw,44px);line-height:1.35;padding:12px 20px}
.hint{font-size:clamp(23px,2.12vw,40px)}
.feedback{font-size:clamp(22px,1.94vw,37px)}
.hintBtn{font-size:clamp(21px,1.72vw,31px)}
textarea{font-size:clamp(24px,2.05vw,38px)}
.stage{font-size:clamp(16px,1.48vw,27px);padding:9px 21px}
.brand{font-size:clamp(18px,1.7vw,30px)}
.count{font-size:clamp(18px,1.5vw,28px)}
.nav{font-family:inherit;font-size:clamp(22px,2vw,37px);font-weight:900}
.footerNote{font-size:clamp(16px,1.42vw,26px)}
.tag{font-size:clamp(21px,1.92vw,36px)}
.eyebrow{font-size:clamp(18px,1.6vw,29px)}
@media(max-width:850px){.title{font-size:clamp(28px,4.4vw,46px)}.prompt{font-size:clamp(23px,3.4vw,37px)}.option{font-size:clamp(21px,3vw,33px)}.stage{padding:7px 11px}}
@media(max-height:700px){.panel{max-height:78vh;padding:clamp(12px,1.7vw,30px)}.options{margin-top:11px;gap:9px}.option{padding:10px 14px}.title{margin-bottom:9px}}

tối để luyện cờ và tham gia câu lạc bộ vào cuối tuần trong một tháng."}, {"stage": 1, "type": "choice", "title": "Kế hoạch một tháng", "prompt": "Điểm nào thể hiện rõ nhất Quang đã có kế hoạch?", "options": ["Bạn thích chơi cờ và tin mình sẽ đạt giải.", "Bạn muốn được mọi người khen vì chơi cờ giỏi.", "Bạn xác định thời gian luyện tập mỗi tối và sinh hoạt câu lạc bộ."], "correct": 2, "explain": "Một kế hoạch cần nêu được việc làm cụ thể và thời gian thực hiện."}, {"stage": 1, "type": "picture", "title": "Hà học tiếng Anh", "image": "english", "prompt": "Hà muốn giỏi tiếng Anh như chị. Hà sẽ làm những việc gì?", "hint": "Hà dành 30 phút mỗi tối luyện phát âm, trò chuyện tiếng Anh với chị và đọc thêm sách truyện tiếng Anh."}, {"stage": 1, "type": "reveal", "title": "Có những loại kế hoạch nào?", "prompt": "Dựa vào thời gian thực hiện, kế hoạch cá nhân có thể được lập cho các khoảng thời gian khác nhau.", "points": ["Kế hoạch trong ngày: ôn bài, làm việc nhà, nghỉ ngơi.", "Kế hoạch trong tuần hoặc tháng: luyện tập một kĩ năng, đọc sách.", "Kế hoạch dài hạn: hướng tới mục tiêu trong học kì hoặc năm học."]}, {"stage": 1, "type": "story", "title": "Câu chuyện: Một ngày làm việc của Bác", "prompt": "Bác Hồ có thói quen làm việc theo kế hoạch và rất đúng giờ. Bác chủ động đặt thời gian cho từng hoạt động và thực hiện các công việc đã dự định.", "question": "Em học được điều gì từ thói quen làm việc của Bác?", "hint": "Biết quý trọng thời gian, sắp xếp công việc hợp lí, có kỉ luật và giữ đúng kế hoạch."}, {"stage": 1, "type": "picture", "title": "Hiền chưa có kế hoạch", "image": "mom", "prompt": "Hiền thường làm việc tùy hứng nên học bài muộn, đôi khi không kịp hoàn thành việc được giao. Theo em, điều gì khiến bạn gặp khó khăn?", "hint": "Hiền chưa sắp xếp thời gian, chưa xác định thứ tự ưu tiên; nên lập thời gian biểu phù hợp và thực hiện đều đặn."}, {"stage": 1, "type": "choice", "title": "Vì sao cần lập kế hoạch?", "prompt": "Ý kiến nào hợp lí nhất?", "options": ["Lập kế hoạch giúp quản lí thời gian, làm việc chủ động và hướng đến mục tiêu.", "Lập kế hoạch giúp mọi việc chắc chắn thành công dù không cần cố gắng.", "Chỉ người lớn có nhiều công việc mới cần lập kế hoạch."], "correct": 0, "explain": "Kế hoạch giúp chủ động và hiệu quả hơn nhưng vẫn cần nỗ lực và điều chỉnh khi cần."}, {"stage": 1, "type": "picture", "title": "Nam muốn vào đội bóng rổ", "image": "basket", "prompt": "Mục tiêu cụ thể của Nam là gì? Bạn có thể cần làm gì để đạt mục tiêu đó?", "hint": "Nam muốn được chọn vào đội bóng rổ của trường để dự giải cấp huyện; cần luyện kĩ năng và thể lực theo lộ trình."}, {"stage": 1, "type": "picture", "title": "Xác định mục tiêu", "image": "goal", "prompt": "Nam cần viết mục tiêu như thế nào để có thể theo dõi tiến bộ?", "hint": "Ví dụ: Trong ba tháng, em tập luyện bóng rổ đều đặn để tham gia tuyển chọn của trường."}, {"stage": 1, "type": "picture", "title": "Nhận biết điểm mạnh, điểm yếu", "image": "reflect", "prompt": "Nam có lợi thế chiều cao nhưng thể lực và sức bền còn hạn chế. Bạn cần quan tâm điều gì?", "hint": "Tận dụng điểm mạnh và lên kế hoạch cải thiện điểm yếu bằng cách luyện tập an toàn, đều đặn."}, {"stage": 1, "type": "picture", "title": "Lập kế hoạch hành động", "image": "practice", "prompt": "Ngoài tập bóng rổ hằng ngày, Nam còn sắp xếp hoạt động nào để nâng cao thể lực?", "hint": "Nam tập chạy bộ ba buổi sáng mỗi tuần để cải thiện sức bền."}, {"stage": 1, "type": "reveal", "title": "Bốn bước lập kế hoạch cá nhân", "prompt": "Hãy ghi nhớ các bước lập kế hoạch theo trình tự dễ thực hiện.", "points": ["1. Xác định mục tiêu cụ thể.", "2. Xác định thời gian hoàn thành.", "3. Nhận biết điểm mạnh và điểm cần cải thiện.", "4. Lập những việc cần làm, thời gian thực hiện và cách kiểm tra kết quả."]}, {"stage": 2, "type": "section", "title": "LUYỆN TẬP", "prompt": "Lựa chọn, giải thích và thực hành các bước lập kế hoạch."}, {"stage": 2, "type": "choice", "title": "Kế hoạch có cần thiết không?", "prompt": "“Chỉ người lớn mới cần lập kế hoạch cá nhân.” Em nhận xét thế nào?", "options": ["Đúng, học sinh thường không có việc gì cần sắp xếp.", "Không đúng, học sinh cũng cần lập kế hoạch học tập và sinh hoạt.", "Đúng nếu học sinh chỉ có một môn học yêu thích."], "correct": 1, "explain": "Lập kế hoạch giúp cả học sinh chủ động trong học tập, giải trí và sinh hoạt."}, {"stage": 2, "type": "choice", "title": "Tính linh hoạt của kế hoạch", "prompt": "Khi đã lập kế hoạch nhưng có việc quan trọng phát sinh, em nên làm gì?", "options": ["Kiên quyết làm theo kế hoạch cũ dù không còn phù hợp.", "Bỏ hẳn mọi mục tiêu để khỏi mất thời gian.", "Điều chỉnh thời gian và việc làm hợp lí, vẫn hướng tới mục tiêu."], "correct": 2, "explain": "Kế hoạch có thể điều chỉnh khi điều kiện thay đổi."}, {"stage": 2, "type": "choice", "title": "Một lúc quá nhiều mục tiêu", "prompt": "Hiếu lập quá nhiều mục tiêu và không kịp thực hiện. Em khuyên bạn thế nào?", "options": ["Chọn mục tiêu ưu tiên, chia nhỏ việc và sắp xếp thời gian phù hợp.", "Giữ tất cả mục tiêu và giảm thời gian ngủ để hoàn thành.", "Không cần lập kế hoạch vì việc gì cũng có thể thay đổi."], "correct": 0, "explain": "Kế hoạch tốt cần phù hợp năng lực và quỹ thời gian."}, {"stage": 2, "type": "choice", "title": "Sắp xếp đúng trình tự", "prompt": "Việc nào nên làm đầu tiên khi lập một kế hoạch cá nhân?", "options": ["Liệt kê các phần thưởng sau khi thành công.", "Xác định một mục tiêu cụ thể muốn đạt được.", "Lập lịch hoạt động khi chưa biết mục tiêu."], "correct": 1, "explain": "Mục tiêu là đích đến, giúp em chọn việc và mốc thời gian phù hợp."}, {"stage": 2, "type": "choice", "title": "Sau khi xác định mục tiêu", "prompt": "Em đã biết mục tiêu của mình. Bước nào tiếp theo phù hợp nhất?", "options": ["Xác định thời hạn để hoàn thành mục tiêu.", "Chờ gần đến hạn rồi mới bắt đầu.", "Chỉ kể mục tiêu cho bạn bè nghe."], "correct": 0, "explain": "Thời gian hoàn thành giúp xác định nhịp độ thực hiện."}, {"stage": 2, "type": "choice", "title": "Tìm hiểu điểm mạnh – điểm yếu", "prompt": "Vì sao nên nhận biết điểm mạnh, điểm yếu trước khi lên lịch hành động?", "options": ["Để không cần làm những công việc khó.", "Để chọn cách làm phù hợp và tập trung cải thiện hạn chế.", "Để so sánh xem mình giỏi hơn bạn nào."], "correct": 1, "explain": "Tự đánh giá giúp xây dựng kế hoạch khả thi và phù hợp bản thân."}, {"stage": 2, "type": "choice", "title": "Theo dõi và điều chỉnh", "prompt": "Khi một việc trong kế hoạch chưa hoàn thành đúng hạn, em nên làm gì?", "options": ["Gạch bỏ luôn mục tiêu vì không còn giá trị.", "Giấu kết quả để không ai nhận xét.", "Tìm nguyên nhân rồi điều chỉnh cách làm hoặc thời gian hợp lí."], "correct": 2, "explain": "Kiểm tra tiến độ để điều chỉnh là một phần của thực hiện kế hoạch."}, {"stage": 2, "type": "order", "title": "Sắp xếp các bước lập kế hoạch", "prompt": "Hãy đưa bốn bước vào đúng thứ tự từ 1 đến 4.", "items": ["Xác định mục tiêu cụ thể", "Xác định thời gian hoàn thành", "Nhận biết điểm mạnh, điểm yếu", "Lập kế hoạch hành động cụ thể"]}, {"stage": 2, "type": "choice", "title": "Kế hoạch của Hà", "prompt": "Hà làm thời gian biểu cho tất cả các ngày, kể cả cuối tuần, không có lúc nghỉ ngơi. Em nhận xét thế nào?", "options": ["Kế hoạch rất tốt vì mọi phút đều phải dùng để học.", "Nên dành thời gian nghỉ ngơi và điều chỉnh lịch phù hợp.", "Không cần thời gian biểu vì cuối tuần chỉ nên vui chơi."], "correct": 1, "explain": "Cần cân bằng học tập, hoạt động thể chất, việc nhà và nghỉ ngơi."}, {"stage": 2, "type": "picture", "title": "Nhận xét kế hoạch của Phương Anh", "image": "board", "prompt": "Phương Anh muốn rèn sức khỏe nhưng kế hoạch chỉ có vài việc. Em đề xuất bổ sung gì để dễ thực hiện và theo dõi?", "hint": "Nêu rõ ngày, giờ tập; hoạt động cụ thể; thời gian duy trì và cách tự đánh giá. Cần tập an toàn theo sức khỏe."}, {"stage": 2, "type": "talk", "title": "Tình huống: Loan luyện viết", "prompt": "Loan viết chữ đẹp nhưng tốc độ còn chậm. Em hãy đề xuất một kế hoạch luyện viết nhanh hơn trong học kì này.", "hint": "Mục tiêu vừa sức; dành 10–15 phút mỗi ngày luyện viết rõ, đúng và tăng dần tốc độ; tự kiểm tra mỗi tuần."}, {"stage": 2, "type": "talk", "title": "Tình huống: Minh muốn sống khỏe", "prompt": "Minh ít ăn rau, thích đồ ăn nhanh, chưa biết bắt đầu thay đổi thói quen thế nào. Em sẽ gợi ý điều gì?", "hint": "Chọn mục tiêu nhỏ: ăn thêm rau phù hợp mỗi bữa, vận động hằng ngày và ngủ đủ; theo dõi, điều chỉnh cùng gia đình."}, {"stage": 2, "type": "talk", "title": "Tình huống: Ngọc cần giúp bà", "prompt": "Ngọc đã lên kế hoạch đi chơi, nhưng bà bị ốm và mẹ muốn Ngọc giúp chăm bà. Ngọc lo không kịp làm việc khác. Em sẽ làm gì?", "hint": "Ưu tiên giúp gia đình, trao đổi cùng mẹ để phân chia việc phù hợp, điều chỉnh kế hoạch học và chơi."}, {"stage": 3, "type": "section", "title": "VẬN DỤNG", "prompt": "Từ một mục tiêu nhỏ, em hãy lập kế hoạch thật cho bản thân!"}, {"stage": 3, "type": "planner", "title": "Kế hoạch cá nhân của em", "prompt": "Điền mục tiêu, thời hạn và những việc em sẽ thực hiện. Sau đó có thể in hoặc lưu bản kế hoạch.", "hint": "Gợi ý mục tiêu: đọc sách mỗi ngày, luyện tiếng Anh, làm bài đúng hạn, rèn thể thao."}, {"stage": 3, "type": "talk", "title": "Chia sẻ với bạn", "prompt": "Hãy giới thiệu kế hoạch của em trước lớp. Bạn bè có thể góp ý để kế hoạch thực tế hơn.", "hint": "Kiểm tra: mục tiêu có rõ không, hạn có phù hợp không, từng việc có cụ thể không, có thời gian nghỉ không?"}, {"stage": 3, "type": "talk", "title": "Học tập từ những người có kế hoạch", "prompt": "Em biết ai có thói quen sống, học tập hoặc làm việc theo kế hoạch? Em học được điều gì từ người ấy?", "hint": "Chia sẻ câu chuyện và một thói quen tốt mà em muốn thử áp dụng trong tuần này."}, {"stage": 3, "type": "reveal", "title": "Ghi nhớ", "prompt": "KẾ HOẠCH LẬP SẴN RÕ RÀNG – QUYẾT TÂM THỰC HIỆN EM CÀNG THÀNH CÔNG!", "points": ["Có mục tiêu rõ ràng và thời gian hoàn thành phù hợp.", "Chọn việc làm cụ thể dựa trên điểm mạnh và điểm cần cải thiện.", "Kiên trì thực hiện, thường xuyên kiểm tra và điều chỉnh."]}, {"stage": 3, "type": "finish", "title": "EM ĐÃ BIẾT LẬP KẾ HOẠCH!", "prompt": "Hãy bắt đầu với một việc nhỏ ngay hôm nay và theo dõi tiến bộ của mình!"}];const images={"boys": "data:image/webp;base64,UklGRlg/AABXRUJQVlA4IEw/AADw/ACdASqSAUIBPlEkj0WjoiETqT18OAUEpu4W8OQPV9lPh5eH1l8Ife+chyL2s/D/wHrF/weyb3//eeZ/0Z/zfzU/1XzK/4f7Pe7/+of6P2Dv2Q89z1u/vD6mv3A/dr3bv+966/7X/ufyA+Q7+ff2Tri/Qy/bb06P3W+JD+t/+D9y/bE1RH1l5wPI79b4e/kf1n+n/wHonZZ+1f/m9C/5p+Cv3/+L9JfB/80/oPQI/Lv61+vXr+Q6XEfhPwJNc7xJ+PfyCfzz+5f73ywvFy9g9gb+m/4H9nvdj/wf2w9PH6R/s//j/s/gU/n/+NLBsCic2yRPVA19F9mLeSYp2r3ml48vFlIKNfRfUkKddE0AKL9cCTJ0te9AMiPHFWsR2RK+d1qkTesiRnUdxw0X2SDGs9zGMoMGth1EYi2SjW3vUZfxLEo7BhBZ2IyfcbOQX+mQ17Xxs6LBnm68VF/bxWoH6D7ktlf7mYt5GVsIqGbpTIrKxAbL1HIWEF87IH3vUmxi+YyvYMoRI757+B0onDSSPFFvw47yFfBtVrU5+rf8VnmPaZfnwRfKq7Fb/eulbOe6EjrpyBNVcm069GOt46cf2voXEEOqu3YIsqqkh0nz4R4pvlgA+mCR3YTFrcdfMxRyNZt/2teBkfefdUmPSOnThqy4ySJAaM4KEjy1Fnugbo6ZW3ekwbz9jxDEGA07avEDZ0whoGRw/CfKtI4vp7lOy+9jnjL8oArau2GQ63A/L16Ej+Tu6Pvnv+jApLYdkgg5mDqRBZsw1yDGxgfmsMarMicqXcv+FRCCgyqOxaco/ujys6lG/X9IPfpoSWfYUVBTrHcAGgYhHIiHpsbwUsprXNF0+e3o84cuAqChbuv+hY+tEgATBMQM6s3bpbdKpkhkNu0CVT3Gwt8N+L2QjWzENuv4MMsDMt+COlVW3EEEVuZeKTRNSv3u/HfkXHyhSwfkzxyaSFuhRw9IHsnIrN3F5RTSf9kYn3bTkhivooHoE+DHnysv877hevx03uk/aowQq1uaCxeZQ21mmDxnctcF8MMxBeMN6yQnwQURRniGPn7o1rbGv5OW3kRe8p59fXNqb2ebqj7XLBymH3yjt7nvyI4/aa9ZckGSwh+7o+XMb8NOKPk8YZEayVJCoAlsNGqj8QUDDEl0BYEvmCTOeg3birDrXzoiOADm4QdWMw8G9fI5WyMorD9y3VPmZy/OWoAYXA2H9zXzcBhhd+2/GoC7kJFa7aXSpR5Yhm9AUj1eJki4kTi/VkTtbHlgQwhkZ6heAt9/ygg7NjvYOufuSIjUuAD9ueG0TwH0H/QgAUU8Q0yAXGT8IQdb6967HloTP3k/08ZLx0DX0HKz7joeuHo+tfUB2FqK5jH8GdLaX/hRg/VJoAC4YICYHxWpyJNGzBUpoQqWRkU1goOSjyQlXs9GwVtFLeQU2ixfjjwPJTrFpx3dC6ZGQOUk75hjfwto0sthaOvEXcVPKDlVE99wtGb1KSK5o+KYaHF9RUmESS8ak5Rm+6w49WVeeDI8BXpsBKAL34VSo5YZ+/V8uq0YU4T6urHIKBL5SC5rFdEDXKroP8ouohxG0THPiHJVJa805+upAWTTraUgvEPAgfR65UaHrsOEi1SBivrRnlmavIwBbzT7iYQlyquuQ4AgW1X236gSmDpWF6retvVERBvPcsOROZwlairbtvUXZdWtW+4TnIwNrEey5TWVE1uoQmwGApC
